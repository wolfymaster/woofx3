<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>counter</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #box {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 8px;
    }

    #text {
      width: 100%;
      font-weight: bold;
      line-height: 1.2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>
  <div id="box">
    <div id="text"></div>
  </div>

  <script>
    (function () {
      const host = window.widgetHost;
      if (!host) {
        return;
      }
      const settings = host.settings;
      const el = document.getElementById("text");
      el.style.color = str(settings.color, "#ffffff");
      el.style.fontFamily = str(settings.fontFamily, "Roboto, system-ui, sans-serif");
      el.style.fontSize = num(settings.fontSize, 48) + "px";
      el.style.textAlign = ["left", "center", "right"].includes(settings.align) ? settings.align : "center";

      const counter = str(settings.counter, "");
      if (counter === "") {
        return;
      }
      const template = str(settings.text, "{value}");

      // The host sends the counter as a whole, `{ value, settings }`: what
      // it stores, and its own settings, which hold its starting value and
      // goals. Nothing shows until the first one arrives rather than a
      // number that may be wrong.
      host.storage.subscribe("resource:" + counter, (instance) => {
        if (instance === null || typeof instance !== "object") {
          return;
        }
        const instanceSettings = instance.settings || {};
        const value = counterValue(instance.value, numberOr(instanceSettings.initialValue, 0));
        const goal = parseGoals(instanceSettings.goals).find((g) => g.value > value) || null;
        render(el, fill(template, {
          value: String(value),
          goal: goal ? String(goal.value) : "",
          goalName: goal ? goal.name : "",
        }));
      });
    })();

    // The counter's number from what it stores, or its starting value when
    // it stores nothing yet. Stored as `{ value, reached }`, or as a bare
    // number by a counter last written before counters carried goals. Must
    // read as `readState` in functions/counter.js does.
    function counterValue(stored, initial) {
      const raw = stored !== null && typeof stored === "object" ? stored.value : stored;
      return numberOr(raw, initial);
    }

    // The counter's goals as `{ value, name }`, smallest first and one per
    // number. Must read as `parseGoals` in functions/counter.js does.
    function parseGoals(raw) {
      const rows = typeof raw === "string" ? raw.split(",").map((part) => ({ value: part })) : raw;
      if (!Array.isArray(rows)) {
        return [];
      }
      const goals = [];
      for (const row of rows) {
        if (row === null || typeof row !== "object") {
          continue;
        }
        const text = typeof row.value === "string" ? row.value.trim() : row.value;
        const value = Number(text);
        if (text === "" || text === null || text === undefined || !Number.isFinite(value)) {
          continue;
        }
        const name = typeof row.name === "string" ? row.name.trim() : "";
        const existing = goals.find((goal) => goal.value === value);
        if (!existing) {
          goals.push({ value, name });
        } else if (existing.name === "") {
          existing.name = name;
        }
      }
      return goals.sort((a, b) => a.value - b.value);
    }

    function numberOr(value, fallback) {
      const number = Number(value);
      return value === null || value === undefined || value === "" || !Number.isFinite(number) ? fallback : number;
    }

    // Replaces each {token} it has a value for, and leaves anything else as
    // written.
    function fill(template, values) {
      return template.replace(/\{(value|goal|goalName)\}/g, (_, token) => values[token]);
    }

    // Saved text may carry {primary} markers, from a highlight markup this
    // widget does not draw. Dropping them shows the words between them in the
    // text's color rather than the markers themselves.
    function render(el, text) {
      el.textContent = text.split("{primary}").join("");
    }

    function str(value, fallback) {
      return typeof value === "string" && value.trim() !== "" ? value : fallback;
    }

    function num(value, fallback) {
      return typeof value === "number" && Number.isFinite(value) ? value : fallback;
    }
  </script>
</body>

</html>
