<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>counter</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #box {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 8px;
    }

    /* Colour, font, size and alignment come from the placement's settings
       through the host's bindings, so changing them updates the widget in
       place. */
    #text {
      width: 100%;
      color: var(--setting-color, #ffffff);
      font-family: var(--setting-fontFamily, Roboto, system-ui, sans-serif);
      font-size: calc(var(--setting-fontSize, 48) * 1px);
      text-align: var(--setting-align, center);
      font-weight: bold;
      line-height: 1.2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>
  <div id="box">
    <div id="text"></div>
  </div>

  <script>
    (function () {
      const host = window.widgetHost;
      if (!host) {
        return;
      }
      const el = document.getElementById("text");

      // The counter followed, how to stop following it, and the last reading
      // of it. The host sends the counter as a whole, `{ value, settings }`:
      // what it stores, and its own settings, which hold its starting value
      // and goals. Nothing shows until the first one arrives rather than a
      // number that may be wrong.
      let following = null;
      let stopFollowing = null;
      let instance = null;

      function draw() {
        if (instance === null) {
          return;
        }
        const instanceSettings = instance.settings || {};
        const value = counterValue(instance.value, numberOr(instanceSettings.initialValue, 0));
        const goal = parseGoals(instanceSettings.goals).find((g) => g.value > value) || null;
        render(el, fill(str(host.settings.text, "{value}"), {
          value: String(value),
          goal: goal ? String(goal.value) : "",
          goalName: goal ? goal.name : "",
        }));
      }

      // Follows the counter the settings name and draws it with their template.
      function follow() {
        const counter = str(host.settings.counter, "");
        if (counter === following) {
          draw();
          return;
        }
        if (stopFollowing !== null) {
          stopFollowing();
          stopFollowing = null;
        }
        following = counter;
        instance = null;
        el.textContent = "";
        if (counter === "") {
          return;
        }
        stopFollowing = host.storage.subscribe("resource:" + counter, (next) => {
          if (next === null || typeof next !== "object") {
            return;
          }
          instance = next;
          draw();
        });
      }

      // On a scene, an edit to the template or the counter redraws in place
      // rather than reloading the widget. A host without the call reloads it.
      if (host.surface !== "alert" && typeof host.onSettingsChange === "function") {
        host.onSettingsChange(follow);
      }
      follow();
    })();

    // The counter's number from what it stores, or its starting value when
    // it stores nothing yet. Stored as `{ value, reached }`, or as a bare
    // number by a counter last written before counters carried goals. Must
    // read as `readState` in functions/counter.js does.
    function counterValue(stored, initial) {
      const raw = stored !== null && typeof stored === "object" ? stored.value : stored;
      return numberOr(raw, initial);
    }

    // The counter's goals as `{ value, name }`, smallest first and one per
    // number. Must read as `parseGoals` in functions/counter.js does.
    function parseGoals(raw) {
      const rows = typeof raw === "string" ? raw.split(",").map((part) => ({ value: part })) : raw;
      if (!Array.isArray(rows)) {
        return [];
      }
      const goals = [];
      for (const row of rows) {
        if (row === null || typeof row !== "object") {
          continue;
        }
        const text = typeof row.value === "string" ? row.value.trim() : row.value;
        const value = Number(text);
        if (text === "" || text === null || text === undefined || !Number.isFinite(value)) {
          continue;
        }
        const name = typeof row.name === "string" ? row.name.trim() : "";
        const existing = goals.find((goal) => goal.value === value);
        if (!existing) {
          goals.push({ value, name });
        } else if (existing.name === "") {
          existing.name = name;
        }
      }
      return goals.sort((a, b) => a.value - b.value);
    }

    function numberOr(value, fallback) {
      const number = Number(value);
      return value === null || value === undefined || value === "" || !Number.isFinite(number) ? fallback : number;
    }

    // Replaces each {token} it has a value for, and leaves anything else as
    // written.
    function fill(template, values) {
      return template.replace(/\{(value|goal|goalName)\}/g, (_, token) => values[token]);
    }

    // Saved text may carry {primary} markers, from a highlight markup this
    // widget does not draw. Dropping them shows the words between them in the
    // text's color rather than the markers themselves.
    function render(el, text) {
      el.textContent = text.split("{primary}").join("");
    }

    function str(value, fallback) {
      return typeof value === "string" && value.trim() !== "" ? value : fallback;
    }
  </script>
</body>

</html>
