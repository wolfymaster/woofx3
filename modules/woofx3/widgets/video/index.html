<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>video</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #video {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <video id="video" playsinline preload="auto"></video>

  <script>
    (function () {
      const host = window.widgetHost;
      if (!host || host.surface !== "alert") {
        return;
      }
      const settings = host.settings;
      const video = document.getElementById("video");
      const seconds = num(settings.duration, 0);
      const loop = settings.loop === true;
      video.style.objectFit = ["contain", "cover", "fill"].includes(settings.fit) ? settings.fit : "contain";
      video.volume = volume(settings.volume);
      // A clip shorter than a set duration loops until the time is up.
      video.loop = loop || seconds > 0;
      // Loaded as the frame boots rather than when the alert arrives, so the
      // clip is ready, or nearly, by the time the alert asks for it.
      const ready = loadMedia(host, mediaUrl(settings.src)).then((src) => {
        video.src = src;
      });

      // Looping with no duration, the video has no length of its own: it
      // plays for as long as the rest of the alert does.
      if (loop && seconds <= 0) {
        host.onEvent(() => {
          ready.then(() => play(video)).catch(() => {});
        });
        return;
      }

      host.onEvent((event) => {
        let finished = false;
        const finish = () => {
          if (finished) {
            return;
          }
          finished = true;
          video.pause();
          video.style.visibility = "hidden";
          event.complete();
        };
        if (seconds > 0) {
          // Counted from the first frame, not from the alert: a clip still
          // downloading would otherwise spend its time on a blank frame.
          video.addEventListener("playing", () => setTimeout(finish, seconds * 1000), { once: true });
        } else {
          video.addEventListener("ended", finish);
        }
        video.addEventListener("error", finish);
        ready.then(() => play(video)).catch(finish);
      }, { autoComplete: false });
    })();

    // The URL to play from: the host's cached copy when it has one.
    function loadMedia(host, url) {
      if (!url) {
        return Promise.reject(new Error("no clip is set"));
      }
      return typeof host.loadMedia === "function" ? host.loadMedia(url) : Promise.resolve(url);
    }

    // A browser that refuses to autoplay sound still plays the video muted.
    function play(video) {
      return video.play().catch(() => {
        video.muted = true;
        return video.play();
      });
    }

    function volume(value) {
      return Math.min(100, Math.max(0, num(value, 100))) / 100;
    }

    // A media setting is a URL, or the asset picker's `{ url, ... }`.
    function mediaUrl(value) {
      if (typeof value === "string") {
        return value;
      }
      if (value && typeof value.url === "string") {
        return value.url;
      }
      return "";
    }

    function num(value, fallback) {
      return typeof value === "number" && Number.isFinite(value) ? value : fallback;
    }
  </script>
</body>

</html>
