<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>text</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #box {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 8px;
    }

    /* Colour, font, size and alignment come from the placement's settings
       through the host's bindings, so changing them updates the widget in
       place. */
    #text {
      width: 100%;
      color: var(--setting-color, #ffffff);
      font-family: var(--setting-fontFamily, Roboto, system-ui, sans-serif);
      font-size: calc(var(--setting-fontSize, 48) * 1px);
      text-align: var(--setting-align, center);
      font-weight: bold;
      line-height: 1.2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>

<body>
  <div id="box">
    <div id="text"></div>
  </div>

  <script>
    (function () {
      const host = window.widgetHost;
      if (!host) {
        return;
      }
      const settings = host.settings;
      const el = document.getElementById("text");

      el.textContent = withoutMarkup(str(settings.text, ""));

      playForDuration(host, num(settings.duration, 0), () => {
        el.style.visibility = "hidden";
      });
    })();

    // In an alert, a duration gives this widget a length of its own: it
    // completes when the time is up, and the alert waits for it. Without one
    // it completes at once and stays up for as long as the alert does.
    function playForDuration(host, seconds, hide) {
      if (host.surface !== "alert") {
        return;
      }
      if (seconds <= 0) {
        host.onEvent(() => {});
        return;
      }
      host.onEvent((event) => {
        setTimeout(() => {
          hide();
          event.complete();
        }, seconds * 1000);
      }, { autoComplete: false });
    }

    // Saved text may carry {primary} markers, from a highlight markup this
    // widget does not draw. Dropping them shows the words between them in the
    // text's color rather than the markers themselves.
    function withoutMarkup(text) {
      return text.split("{primary}").join("");
    }

    function str(value, fallback) {
      return typeof value === "string" && value.trim() !== "" ? value : fallback;
    }

    function num(value, fallback) {
      return typeof value === "number" && Number.isFinite(value) ? value : fallback;
    }
  </script>
</body>

</html>
