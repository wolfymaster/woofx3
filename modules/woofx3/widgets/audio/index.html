<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>audio</title>
</head>

<body>
  <script>
    (function () {
      const host = window.widgetHost;
      if (!host || host.surface !== "alert") {
        return;
      }
      const settings = host.settings;
      const seconds = num(settings.duration, 0);
      const audio = new Audio();
      audio.preload = "auto";
      audio.volume = volume(settings.volume);
      // Loaded as the frame boots rather than when the alert arrives, so the
      // sound is ready, or nearly, by the time the alert asks for it.
      const ready = loadMedia(host, mediaUrl(settings.src)).then((src) => {
        audio.src = src;
      });
      // Reported when an alert asks for the sound, not as the frame boots.
      ready.catch(() => {});

      host.onEvent((event) => {
        let finished = false;
        const finish = (failure) => {
          if (finished) {
            return;
          }
          finished = true;
          audio.pause();
          if (failure) {
            console.warn("[audio] sound did not play", failure);
            host.reportStatus("error", failure);
          }
          event.complete();
        };
        if (seconds > 0) {
          // Counted from the first sound, not from the alert: a sound still
          // downloading would otherwise spend its time in silence.
          audio.addEventListener("playing", () => setTimeout(finish, seconds * 1000), { once: true });
        } else {
          audio.addEventListener("ended", () => finish());
        }
        audio.addEventListener("error", () => {
          finish({ reason: "media error", code: audio.error ? audio.error.code : null });
        });
        ready
          .then(() => audio.play())
          .catch((err) => finish({ reason: err && err.message ? err.message : String(err) }));
      }, { autoComplete: false });
    })();

    // The URL to play from: the host's cached copy when it has one.
    function loadMedia(host, url) {
      if (!url) {
        return Promise.reject(new Error("no sound is set"));
      }
      return typeof host.loadMedia === "function" ? host.loadMedia(url) : Promise.resolve(url);
    }

    function volume(value) {
      return Math.min(100, Math.max(0, num(value, 100))) / 100;
    }

    // A media setting is a URL, or the asset picker's `{ url, ... }`.
    function mediaUrl(value) {
      if (typeof value === "string") {
        return value;
      }
      if (value && typeof value.url === "string") {
        return value.url;
      }
      return "";
    }

    function num(value, fallback) {
      return typeof value === "number" && Number.isFinite(value) ? value : fallback;
    }
  </script>
</body>

</html>
