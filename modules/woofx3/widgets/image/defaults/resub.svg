<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img"><title>Resub</title><style>
.k{fill:none;stroke:#1B1530;stroke-width:30;stroke-linejoin:round;stroke-linecap:round}
.w{fill:none;stroke:#fff;stroke-width:20;stroke-linejoin:round;stroke-linecap:round}
.f{stroke:#1B1530;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
.a{transform-box:fill-box;transform-origin:center;animation-duration:2.4s;animation-iteration-count:infinite}
.o{transform-origin:200px 200px}
@keyframes beat{0%{transform:scale(1)}6%{transform:scale(1.14)}14%{transform:scale(.95)}22%{transform:scale(1.03)}30%,100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes ring{0%{transform:scale(.55);opacity:0}4%{opacity:.95}38%{transform:scale(1.18);opacity:0}100%{transform:scale(1.18);opacity:0}}
@keyframes spin45{to{transform:rotate(45deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}12%{transform:scale(1.1) rotate(20deg);opacity:1}26%{transform:scale(0) rotate(45deg);opacity:0}}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}8%{opacity:1}55%{transform:translate(var(--dx),-130px) scale(1);opacity:0}100%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-260px) skewX(-20deg)}34%,100%{transform:translateX(260px) skewX(-20deg)}}
@keyframes hop{0%,100%{transform:translate(0,0) rotate(0)}7%{transform:translate(-6px,-46px) rotate(-10deg)}16%{transform:translate(0,4px) rotate(2deg)}22%{transform:translate(0,0) rotate(0)}}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.3);opacity:0}5%{opacity:1}30%{opacity:1}48%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}100%{opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}8%{transform:translateY(-38px)}16%{transform:translateY(3px)}22%{transform:translateY(0)}}
@keyframes climb{0%{transform:translateY(110px);opacity:0}10%{opacity:1}50%{transform:translateY(-130px);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
