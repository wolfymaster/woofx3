<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img"><title>Follow</title><style>
.k{fill:none;stroke:#1B1530;stroke-width:30;stroke-linejoin:round;stroke-linecap:round}
.w{fill:none;stroke:#fff;stroke-width:20;stroke-linejoin:round;stroke-linecap:round}
.f{stroke:#1B1530;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
.a{transform-box:fill-box;transform-origin:center;animation-duration:2.4s;animation-iteration-count:infinite}
.o{transform-origin:200px 200px}
@keyframes beat{0%{transform:scale(1)}6%{transform:scale(1.14)}14%{transform:scale(.95)}22%{transform:scale(1.03)}30%,100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes ring{0%{transform:scale(.55);opacity:0}4%{opacity:.95}38%{transform:scale(1.18);opacity:0}100%{transform:scale(1.18);opacity:0}}
@keyframes spin45{to{transform:rotate(45deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}12%{transform:scale(1.1) rotate(20deg);opacity:1}26%{transform:scale(0) rotate(45deg);opacity:0}}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}8%{opacity:1}55%{transform:translate(var(--dx),-130px) scale(1);opacity:0}100%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-260px) skewX(-20deg)}34%,100%{transform:translateX(260px) skewX(-20deg)}}
@keyframes hop{0%,100%{transform:translate(0,0) rotate(0)}7%{transform:translate(-6px,-46px) rotate(-10deg)}16%{transform:translate(0,4px) rotate(2deg)}22%{transform:translate(0,0) rotate(0)}}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.3);opacity:0}5%{opacity:1}30%{opacity:1}48%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}100%{opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}8%{transform:translateY(-38px)}16%{transform:translateY(3px)}22%{transform:translateY(0)}}
@keyframes climb{0%{transform:translateY(110px);opacity:0}10%{opacity:1}50%{transform:translateY(-130px);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><circle class="a" style="animation-name:ring" cx="200" cy="200" r="150" fill="none" stroke="#FF4D8D" stroke-width="7"/><g class="a" style="animation-name:rise;animation-delay:-0.0s;--dx:-20px" fill="#FF9EC0" stroke="#1B1530" stroke-width="22"><path transform="translate(70 230) scale(0.2) translate(-200 -200)" d="M200 318 C122 262 74 220 74 158 C74 114 107 84 148 84 C172 84 190 97 200 114 C210 97 228 84 252 84 C293 84 326 114 326 158 C326 220 278 262 200 318 Z"/></g><g class="a" style="animation-name:rise;animation-delay:-0.4s;--dx:24px" fill="#FF9EC0" stroke="#1B1530" stroke-width="22"><path transform="translate(334 210) scale(0.2) translate(-200 -200)" d="M200 318 C122 262 74 220 74 158 C74 114 107 84 148 84 C172 84 190 97 200 114 C210 97 228 84 252 84 C293 84 326 114 326 158 C326 220 278 262 200 318 Z"/></g><g class="a" style="animation-name:rise;animation-delay:-0.85s;--dx:-10px" fill="#FF9EC0" stroke="#1B1530" stroke-width="22"><path transform="translate(96 130) scale(0.2) translate(-200 -200)" d="M200 318 C122 262 74 220 74 158 C74 114 107 84 148 84 C172 84 190 97 200 114 C210 97 228 84 252 84 C293 84 326 114 326 158 C326 220 278 262 200 318 Z"/></g><g class="a" style="animation-name:rise;animation-delay:-1.25s;--dx:14px" fill="#FF9EC0" stroke="#1B1530" stroke-width="22"><path transform="translate(310 120) scale(0.2) translate(-200 -200)" d="M200 318 C122 262 74 220 74 158 C74 114 107 84 148 84 C172 84 190 97 200 114 C210 97 228 84 252 84 C293 84 326 114 326 158 C326 220 278 262 200 318 Z"/></g><g class="a" style="animation-name:bob"><g class="a" style="animation-name:beat"><path class="k" d="M200 318 C122 262 74 220 74 158 C74 114 107 84 148 84 C172 84 190 97 200 114 C210 97 228 84 252 84 C293 84 326 114 326 158 C326 220 278 262 200 318 Z"/><path class="w" d="M200 318 C122 262 74 220 74 158 C74 114 107 84 148 84 C172 84 190 97 200 114 C210 97 228 84 252 84 C293 84 326 114 326 158 C326 220 278 262 200 318 Z"/><path class="f" fill="#FF4D8D" d="M200 318 C122 262 74 220 74 158 C74 114 107 84 148 84 C172 84 190 97 200 114 C210 97 228 84 252 84 C293 84 326 114 326 158 C326 220 278 262 200 318 Z"/><path d="M118 150 C118 126 134 112 154 110" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".85"/></g></g><path class="a" style="animation-name:twinkle;animation-delay:-0.00s" fill="#fff" stroke="#1B1530" stroke-width="4" stroke-linejoin="round" d="M86.0 74.0 L89.6 88.4 L104.0 92.0 L89.6 95.6 L86.0 110.0 L82.4 95.6 L68.0 92.0 L82.4 88.4 Z"/><path class="a" style="animation-name:twinkle;animation-delay:-0.55s" fill="#fff" stroke="#1B1530" stroke-width="4" stroke-linejoin="round" d="M326.0 286.0 L328.8 297.2 L340.0 300.0 L328.8 302.8 L326.0 314.0 L323.2 302.8 L312.0 300.0 L323.2 297.2 Z"/></svg>