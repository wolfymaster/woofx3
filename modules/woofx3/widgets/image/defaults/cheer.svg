linejoin="round" d="M300.0 282.0 L303.6 296.4 L318.0 300.0 L303.6 303.6 L300.0 318.0 L296.4 303.6 L282.0 300.0 L296.4 296.4 Z"/><path class="a" style="animation-name:twinkle;animation-delay:-1.65s" fill="#fff" stroke="#1B1530" stroke-width="4" stroke-linejoin="round" d="M110.0 274.0 L112.4 283.6 L122.0 286.0 L112.4 288.4 L110.0 298.0 L107.6 288.4 L98.0 286.0 L107.6 283.6 Z"/></svg>