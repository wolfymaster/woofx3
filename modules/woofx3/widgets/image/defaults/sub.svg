<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img"><title>New sub</title><style>
.k{fill:none;stroke:#1B1530;stroke-width:30;stroke-linejoin:round;stroke-linecap:round}
.w{fill:none;stroke:#fff;stroke-width:20;stroke-linejoin:round;stroke-linecap:round}
.f{stroke:#1B1530;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
.a{transform-box:fill-box;transform-origin:center;animation-duration:2.4s;animation-iteration-count:infinite}
.o{transform-origin:200px 200px}
@keyframes beat{0%{transform:scale(1)}6%{transform:scale(1.14)}14%{transform:scale(.95)}22%{transform:scale(1.03)}30%,100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes ring{0%{transform:scale(.55);opacity:0}4%{opacity:.95}38%{transform:scale(1.18);opacity:0}100%{transform:scale(1.18);opacity:0}}
@keyframes spin45{to{transform:rotate(45deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}12%{transform:scale(1.1) rotate(20deg);opacity:1}26%{transform:scale(0) rotate(45deg);opacity:0}}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}8%{opacity:1}55%{transform:translate(var(--dx),-130px) scale(1);opacity:0}100%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-260px) skewX(-20deg)}34%,100%{transform:translateX(260px) skewX(-20deg)}}
@keyframes hop{0%,100%{transform:translate(0,0) rotate(0)}7%{transform:translate(-6px,-46px) rotate(-10deg)}16%{transform:translate(0,4px) rotate(2deg)}22%{transform:translate(0,0) rotate(0)}}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.3);opacity:0}5%{opacity:1}30%{opacity:1}48%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}100%{opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}8%{transform:translateY(-38px)}16%{transform:translateY(3px)}22%{transform:translateY(0)}}
@keyframes climb{0%{transform:translateY(110px);opacity:0}10%{opacity:1}50%{transform:translateY(-130px);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g class="o" style="animation:spin45 2.4s linear infinite"><path d="M200 200 L389.0 180.1 L389.0 219.9 Z" fill="#fff" opacity=".3"/><path d="M200 200 L347.7 319.6 L319.6 347.7 Z" fill="#fff" opacity=".3"/><path d="M200 200 L219.9 389.0 L180.1 389.0 Z" fill="#fff" opacity=".3"/><path d="M200 200 L80.4 347.7 L52.3 319.6 Z" fill="#fff" opacity=".3"/><path d="M200 200 L11.0 219.9 L11.0 180.1 Z" fill="#fff" opacity=".3"/><path d="M200 200 L52.3 80.4 L80.4 52.3 Z" fill="#fff" opacity=".3"/><path d="M200 200 L180.1 11.0 L219.9 11.0 Z" fill="#fff" opacity=".3"/><path d="M200 200 L319.6 52.3 L347.7 80.4 Z" fill="#fff" opacity=".3"/></g><circle class="a" style="animation-name:ring" cx="200" cy="200" r="150" fill="none" stroke="#FFC21A" stroke-width="7"/><g class="a" style="animation-name:bob"><g class="a" style="animation-name:beat"><path class="k" d="M200.0 78.0 L234.1 159.1 L321.7 166.4 L255.2 223.9 L275.2 309.6 L200.0 264.0 L124.8 309.6 L144.8 223.9 L78.3 166.4 L165.9 159.1 Z"/><path class="w" d="M200.0 78.0 L234.1 159.1 L321.7 166.4 L255.2 223.9 L275.2 309.6 L200.0 264.0 L124.8 309.6 L144.8 223.9 L78.3 166.4 L165.9 159.1 Z"/><path class="f" fill="#FFC21A" d="M200.0 78.0 L234.1 159.1 L321.7 166.4 L255.2 223.9 L275.2 309.6 L200.0 264.0 L124.8 309.6 L144.8 223.9 L78.3 166.4 L165.9 159.1 Z"/><path d="M200.0 134.0 L219.4 179.3 L268.5 183.8 L231.4 216.2 L242.3 264.2 L200.0 239.0 L157.7 264.2 L168.6 216.2 L131.5 183.8 L180.6 179.3 Z" fill="#FFE58A"/></g></g><path class="a" style="animation-name:twinkle;animation-delay:-0.00s" fill="#fff" stroke="#1B1530" stroke-width="4" stroke-linejoin="round" d="M82.0 78.0 L85.6 92.4 L100.0 96.0 L85.6 99.6 L82.0 114.0 L78.4 99.6 L64.0 96.0 L78.4 92.4 Z"/><path class="a" style="animation-name:twinkle;animation-delay:-0.55s" fill="#fff" stroke="#1B1530" stroke-width="4" stroke-linejoin="round" d="M322.0 296.0 L325.2 308.8 L338.0 312.0 L325.2 315.2 L322.0 328.0 L318.8 315.2 L306.0 312.0 L318.8 308.8 Z"/></svg>