<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>image</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    /* Image and fit come from the placement's settings through the host's
       bindings, so changing either updates the widget in place. */
    #image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: var(--setting-fit, contain);
    }
  </style>
</head>

<body>
  <img id="image" alt="" data-setting-src="src" />

  <script>
    (function () {
      const host = window.widgetHost;
      if (!host) {
        return;
      }
      const image = document.getElementById("image");
      playForDuration(host, num(host.settings.duration, 0), () => {
        image.style.visibility = "hidden";
      });
    })();

    // In an alert, a duration gives this widget a length of its own: it
    // completes when the time is up, and the alert waits for it. Without one
    // it completes at once and stays up for as long as the alert does.
    function playForDuration(host, seconds, hide) {
      if (host.surface !== "alert") {
        return;
      }
      if (seconds <= 0) {
        host.onEvent(() => {});
        return;
      }
      host.onEvent((event) => {
        setTimeout(() => {
          hide();
          event.complete();
        }, seconds * 1000);
      }, { autoComplete: false });
    }

    function num(value, fallback) {
      return typeof value === "number" && Number.isFinite(value) ? value : fallback;
    }
  </script>
</body>

</html>
