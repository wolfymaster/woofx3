[package]
name = "generators-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regress = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
