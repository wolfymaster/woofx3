      security:
        - adminBearer: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SubmissionStatus" }
        - { name: moduleId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of submissions. The limit defaults to 50.
          content:
            application/json:
              schema:
                type: object
                required: [submissions, total, limit, offset]
                properties:
                  submissions: { type: array, items: { $ref: "#/components/schemas/Submission" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/submissions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: adminGetSubmission
      summary: One submission with what an operator needs to review it
      description: |
        For a pending submission, the submitted manifest and README. `live` is
        the build the module serves now, or null for a first publish.
        `pricing` is null when approving alone would leave the module
        uninstallable. 409 archive_changed when the staged archive is not the
        one submitted.
      security:
        - adminBearer: []
      responses:
        "200":
          description: The submission.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/submissions/{id}/files:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: adminListSubmissionFiles
      summary: The files in a pending submission's archive
      security:
        - adminBearer: []
      responses:
        "200":
          description: Every file with its size.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, size]
                      properties:
                        path: { type: string }
                        size: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/submissions/{id}/files/{path}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: path, in: path, required: true, description: The file's path in the archive; it may contain slashes., schema: { type: string } }
    get:
      tags: [admin]
      operationId: adminReadSubmissionFile
      summary: One file of a pending submission's archive
      description: UTF-8 text as it is, anything else base64, truncated at 512 KiB.
      security:
        - adminBearer: []
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema:
                type: object
                required: [path, encoding, content, truncated]
                properties:
                  path: { type: string }
                  encoding: { type: string, enum: [utf-8, base64] }
                  content: { type: string }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/submissions/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminApproveSubmission
      summary: Publish the reviewed build and record the approval
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/AdminActor" }
        - { $ref: "#/components/parameters/AdminReason" }
      responses:
        "200":
          description: The decided submission and the module now serving it.
          content:
            application/json:
              schema:
                type: object
                required: [submission, module]
                properties:
                  submission: { $ref: "#/components/schemas/Submission" }
                  module: { $ref: "#/components/schemas/ModuleDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/submissions/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminRejectSubmission
      summary: Record a rejection; the module keeps serving what it served
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/AdminActor" }
        - { $ref: "#/components/parameters/AdminReason" }
      responses:
        "200":
          description: The decided submission.
          content:
            application/json:
              schema:
                type: object
                required: [submission]
                properties:
                  submission: { $ref: "#/components/schemas/Submission" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/listings/{id}/pricing:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    get:
      tags: [admin]
      operationId: adminGetPricing
      summary: A listing's pricing, published or not
      security:
        - adminBearer: []
      responses:
        "200":
          description: The pricing, or null when nobody has priced the listing, which means nobody can acquire it.
          content:
            application/json:
              schema:
                type: object
                required: [pricing]
                properties:
                  pricing:
                    anyOf:
                      - $ref: "#/components/schemas/Pricing"
                      - type: "null"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
