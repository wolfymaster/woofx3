        "503": { $ref: "#/components/responses/Error" }
    put:
      tags: [admin]
      operationId: adminPutPricing
      summary: Set a listing's pricing, audited
      description: The same body and behaviour as putPricing. A publisher cannot price its own listings, so this is how an approved module is put on sale.
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/AdminActor" }
        - { $ref: "#/components/parameters/AdminReason" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PricingRequest" }
      responses:
        "200":
          description: The pricing as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/listings/{id}/stats:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    get:
      tags: [admin]
      operationId: adminListingStats
      summary: A listing's downloads, installs, purchases and gross per UTC day
      security:
        - adminBearer: []
      parameters:
        - name: days
          in: query
          description: How many days back, today included.
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        "200":
          description: One row per day, zero-filled, oldest first, and all-time totals.
          content:
            application/json:
              schema:
                type: object
                required: [days, totals]
                properties:
                  days: { type: array, items: { $ref: "#/components/schemas/DailyStats" } }
                  totals:
                    type: object
                    required: [downloads, installs, purchases, gross]
                    properties:
                      downloads: { type: integer }
                      installs: { type: integer }
                      purchases: { type: integer }
                      gross: { $ref: "#/components/schemas/Gross" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/listings/{id}/credits:
    parameters:
