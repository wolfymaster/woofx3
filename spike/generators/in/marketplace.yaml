        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /entitlements/{id}/activations/clear:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminClearActivations
      summary: Forget the installs a license key has downloaded to, audited
      description: |
        A customer who reinstalled on new machines past the activation cap
        starts over. Takes the admin token and nothing else; the actor and
        reason headers are required.
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/AdminActor" }
