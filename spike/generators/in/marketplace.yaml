      parameters:
        - { name: targetType, in: query, description: Narrows the log to one kind of target. Required with targetId., schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of the log. The limit defaults to 50 and is at most 200.
          content:
            application/json:
              schema:
                type: object
                required: [actions, total, limit, offset]
