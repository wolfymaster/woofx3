              schema: { $ref: "#/components/schemas/ModuleResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      operationId: adminDeleteModuleImage
      summary: Clear a module's uploaded image, audited
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/AdminActor" }
        - { $ref: "#/components/parameters/AdminReason" }
      responses:
        "200":
          description: The module as it stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/publishers:
    get:
      tags: [admin]
      operationId: adminListPublishers
      summary: Every publisher, never with a token
      security:
        - adminBearer: []
      responses:
        "200":
          description: The publishers.
          content:
            application/json:
              schema:
                type: object
                required: [publishers]
                properties:
                  publishers: { type: array, items: { $ref: "#/components/schemas/Publisher" } }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      operationId: adminCreatePublisher
      summary: Create a publisher with its first token
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/AdminActor" }
        - { $ref: "#/components/parameters/AdminReason" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug]
              properties:
                slug: { type: string, description: The username the publisher's listings are attributed to. }
                trusted: { type: boolean, description: Whether public builds publish without review. Defaults to false. }
      responses:
        "201":
          description: The publisher and its token. The token is in this response only.
          content:
            application/json:
              schema:
                type: object
                required: [publisher, token]
                properties:
                  publisher: { $ref: "#/components/schemas/Publisher" }
                  token: { type: string, description: The publisher token. Secret. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/publishers/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      operationId: adminUpdatePublisher
      summary: Set whether a publisher is trusted and whether its tokens work
      description: Both fields are required, so a request always states the state it leaves the publisher in.
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/AdminActor" }
        - { $ref: "#/components/parameters/AdminReason" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [trusted, disabled]
              properties:
                trusted: { type: boolean }
                disabled: { type: boolean }
      responses:
        "200":
          description: The publisher as it stands.
          content:
            application/json:
              schema:
                type: object
                required: [publisher]
                properties:
                  publisher: { $ref: "#/components/schemas/Publisher" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/publishers/{slug}/tokens:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminAddPublisherToken
      summary: Issue another token, for rotation
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/AdminActor" }
        - { $ref: "#/components/parameters/AdminReason" }
      responses:
        "201":
          description: The new token. It is in this response only.
          content:
            application/json:
              schema:
                type: object
                required: [tokenId, token]
                properties:
                  tokenId: { type: integer, format: int64 }
                  token: { type: string, description: The publisher token. Secret. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/publishers/{slug}/tokens/{tokenId}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: tokenId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [admin]
      operationId: adminRevokePublisherToken
      summary: Revoke one publisher token
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/AdminActor" }
        - { $ref: "#/components/parameters/AdminReason" }
      responses:
        "204": { description: Revoked. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      description: |
        A service token held by the control plane or the publishing CLI. It
        names an account in `buyerRef` on the routes that act for one. Each
        named caller may call only its own routes: a valid token on any other
        route answers 403 forbidden.
    buyerBearer:
      type: http
      scheme: bearer
      description: An Ed25519-signed buyer token minted by the control plane. It acts for its own account only.
    devBearer:
      type: http
      scheme: bearer
      description: A read-only token that reveals dev-tier listings. It is never accepted on writes.
    publisherBearer:
      type: http
      scheme: bearer
      description: A publisher's own token (wfxp_...). It publishes under that publisher's name only, on the routes listed with it.
    billingBearer:
      type: http
      scheme: bearer
      description: The billing module's token. It opens the purchase-intent routes and the refund and dispute revoke, and nothing else.
    adminBearer:
      type: http
      scheme: bearer
      description: The operator's token. Every change needs the actor and reason headers.

  parameters:
    ListingId:
      name: id
      in: path
      required: true
      description: A listing id, which is a slug and never needs escaping.
      schema: { type: string }
    BuyerRef:
      name: buyerRef
      in: query
      description: The account a service token acts for, such as `account:<id>`. Required with a service token. Omitted or equal to the account with a buyer token.
      schema: { $ref: "#/components/schemas/BuyerRef" }
    Limit:
      name: limit
      in: query
      description: Page size. The server clamps it to what a response can hold.
      schema: { type: integer, minimum: 1 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0 }
    ImageSlot:
      name: slot
      in: path
      required: true
      description: icon or banner. Any other value is 404 invalid_request.
      schema: { type: string }
    AdminActor:
      name: X-Woofx3-Actor
      in: header
      required: true
      description: Who is making the change. At most 200 bytes. Required on every admin write.
      schema: { type: string, maxLength: 200 }
    AdminReason:
      name: X-Woofx3-Reason
      in: header
      required: true
      description: Why, percent-encoded. At most 2000 bytes. Required on every admin write.
      schema: { type: string, maxLength: 2000 }

  responses:
    Error:
      description: An error. The status says the class and `error.code` the cause.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
    ErrorCode:
      type: string
      description: Every code the service answers. Checked against the Go constants by a test.
      enum:
        - account_required
        - activation_limit
        - admin_not_configured
        - archive_changed
        - archive_gone
        - author_not_found
        - billing_not_configured
        - buyer_mismatch
        - downloads_blocked
        - edition_conflict
        - edition_mismatch
        - entitlement_not_found
        - entitlement_revoked
        - forbidden
        - id_mismatch
        - image_not_found
        - install_id_required
        - intent_expired
        - intent_mismatch
        - intent_not_found
        - intent_settled
        - internal_error
        - invalid_image
        - invalid_manifest
        - invalid_pack
        - invalid_request
        - invalid_signature
        - listing_conflict
        - listing_not_found
        - listing_type_mismatch
        - listing_unavailable
        - module_conflict
        - module_not_found
        - module_not_ready
        - no_payment_needed
        - not_entitled
        - not_sellable
        - payment_required
        - publisher_conflict
        - publisher_not_found
        - rate_limited
        - reason_not_allowed
        - submission_not_found
        - submission_not_pending
        - tier_downgrade
        - unauthorized
        - upload_not_found
        - wrong_publisher

    BuyerRef:
      type: string
      description: An opaque account reference, `account:<id>` for an organization.
    ListingType:
      type: string
      enum: [module, theme, emote, overlay, alert]
    EntitlementSource:
      type: string
      enum: [purchase, upgrade, free, grant]
    ImageSet:
      type: object
      description: Rendition URLs by size name, per image slot.
      properties:
        icon: { type: object, additionalProperties: { type: string } }
        banner: { type: object, additionalProperties: { type: string } }
    Pricing:
      type: object
      required: [mode, currency]
      properties:
        mode: { type: string, enum: [free, paid] }
        currency: { type: string }
        amountCents: { type: integer, format: int64, description: Present on a paid listing. }
        upgrade:
          type: object
          description: What an account holding an earlier edition pays. Present on a paid listing.
          required: [mode]
          properties:
            mode: { type: string, enum: [full, discount, free] }
            amountCents: { type: integer, format: int64 }
    Credit:
      type: object
      required: [name]
      properties:
        name: { type: string }
        role: { type: string }
        url: { type: string }
        avatarUrl: { type: string }
        note: { type: string }
    Preview:
      type: object
      required: [kind, url]
      properties:
        kind: { type: string, enum: [image, video, live] }
        url: { type: string }
        caption: { type: string }
    Emote:
      type: object
      required: [id, name, animated, sizes, original]
      properties:
        id: { type: string }
        name: { type: string }
        animated: { type: boolean }
        sizes: { type: object, additionalProperties: { type: string } }
        original: { type: string }
    CatalogItem:
      type: object
      required: [id, type, name, tags, images, tier, edition, pricing, credits, installCount, weeklyInstallCount, rating, ratingCount, updatedAt]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/ListingType" }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        author: { type: string }
        authorSlug: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        iconUrl: { type: string }
        images: { $ref: "#/components/schemas/ImageSet" }
        featuredRank: { type: integer }
        tier: { type: string, enum: [public, dev] }
        baseModuleId: { type: string, description: The module a theme needs installed first. }
        moduleKey: { type: string, description: Present for a module or theme. }
        edition: { type: integer }
        supersededBy: { type: string, description: The newer edition that replaced this one. }
        pricing:
          anyOf:
            - $ref: "#/components/schemas/Pricing"
            - type: "null"
          description: Null for a listing nobody has priced, which no one can install or buy.
        credits: { type: array, items: { $ref: "#/components/schemas/Credit" } }
        installCount: { type: integer }
        weeklyInstallCount: { type: integer }
        rating: { type: ["number", "null"], description: Always null; nothing rates a listing yet. }
        ratingCount: { type: integer }
        authorAvatarUrl: { type: string }
        updatedAt: { type: string, format: date-time }
    CatalogDetail:
      allOf:
        - $ref: "#/components/schemas/CatalogItem"
        - type: object
          required: [previews]
          properties:
            previews: { type: array, items: { $ref: "#/components/schemas/Preview" } }
            emotes: { type: array, items: { $ref: "#/components/schemas/Emote" }, description: Present for an emote pack. }
            license: { type: string, description: An emote pack's licence as its author declared it. }
            requires: { type: array, items: { type: string }, description: The modules an overlay or alert bundle's widgets come from. }
            module:
              $ref: "#/components/schemas/ModuleDetail"
    Author:
      type: object
      required: [slug, displayName, links, claimed]
      properties:
        slug: { type: string }
        displayName: { type: string }
        bio: { type: string }
        avatarUrl: { type: string }
        links: { type: array, items: { type: object, additionalProperties: true } }
        claimed: { type: boolean, description: False when the page is built only from the author string on listings. }
    ModuleListItem:
      type: object
      required: [id, moduleKey, edition, name, tags, images, tier, listingType, counts, updatedAt]
      properties:
        id: { type: string }
        moduleKey: { type: string }
        edition: { type: integer }
        supersededBy: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        author: { type: string }
        authorSlug: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        iconUrl: { type: string }
        images: { $ref: "#/components/schemas/ImageSet" }
        featuredRank: { type: integer }
        tier: { type: string, enum: [public, dev] }
        listingType: { type: string, enum: [module, theme] }
        baseModuleId: { type: string }
        counts:
          type: object
          required: [triggers, actions, functions, widgets, workflows, commands]
          properties:
            triggers: { type: integer }
            actions: { type: integer }
            functions: { type: integer }
            widgets: { type: integer }
            workflows: { type: integer }
            commands: { type: integer }
        updatedAt: { type: string, format: date-time }
    ModuleDetail:
      type: object
      description: |
        A module or theme. The arrays that mirror the manifest (themes,
        triggers and so on) are documented as open objects: their shape is the
        engine's manifest schema, not this service's.
      required: [id, moduleKey, edition, name, tags, images, tier, listingType, themes, themeable, requires, triggers, actions, functions, widgets, workflows, commands, permissions, localEndpoints, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        moduleKey: { type: string }
        edition: { type: integer }
        supersededBy: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        author: { type: string }
        authorSlug: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        iconUrl: { type: string }
        images: { $ref: "#/components/schemas/ImageSet" }
        featuredRank: { type: integer }
        tier: { type: string, enum: [public, dev] }
        listingType: { type: string, enum: [module, theme] }
        baseModuleId: { type: string }
        themes: { type: array, items: { type: object, additionalProperties: true } }
        themeable: { type: array, items: { type: object, additionalProperties: true } }
        requires: { type: object, additionalProperties: { type: string }, description: Module id to semver range. }
        readme: { type: string }
        triggers: { type: array, items: { type: object, additionalProperties: true } }
        actions: { type: array, items: { type: object, additionalProperties: true } }
        functions: { type: array, items: { type: object, additionalProperties: true } }
        widgets: { type: array, items: { type: object, additionalProperties: true } }
        workflows: { type: array, items: { type: object, additionalProperties: true } }
        commands: { type: array, items: { type: object, additionalProperties: true } }
        permissions: { type: array, items: { type: string } }
        localEndpoints: { type: array, items: { type: object, additionalProperties: true } }
        status: { type: string, enum: [pending, ready] }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Quote:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [owned, free, upgrade_free, upgrade, full, unavailable] }
        amountCents: { type: integer, format: int64, description: Present when the quote costs money. }
        currency: { type: string }
        upgradeFrom: { type: string, description: The earlier edition an upgrade is from. }
        reason:
          type: string
          enum: [not_ready, unpriced, superseded, delisted]
          description: Present when kind is unavailable.
    License:
      type: object
      required: [key, listingId, edition]
      properties:
        key: { type: string, description: The license key. Secret. }
        listingId: { type: string }
        edition: { type: integer }
    Acquired:
      type: object
      required: [entitled, source]
      properties:
        entitled: { type: boolean, const: true }
        source: { $ref: "#/components/schemas/EntitlementSource" }
        license:
          $ref: "#/components/schemas/License"
          description: Absent only for a held entitlement whose stored key cannot be opened.
    BillingIntent:
      description: The intent as the billing module reads it, whole.
      allOf:
        - $ref: "#/components/schemas/Intent"
        - type: object
          required: [listingId, buyerRef, status]
          properties:
            listingId: { type: string }
            buyerRef: { type: string }
            status: { type: string, enum: [open, redeemed, expired] }
    Intent:
      type: object
      required: [id, kind, amountCents, currency, expiresAt]
      properties:
        id: { type: string }
        listingId: { type: string, description: Present when billing reads the intent. }
        buyerRef: { type: string, description: Present when billing reads the intent. }
        kind: { type: string, enum: [full, upgrade] }
        upgradeFrom: { type: string }
        amountCents: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string, enum: [open, redeemed, expired], description: Present when billing reads the intent. }
        expiresAt: { type: string, format: date-time }
    PaymentRequired:
      type: object
      required: [error, intent]
      properties:
        error: { $ref: "#/components/schemas/Error" }
        intent: { $ref: "#/components/schemas/Intent" }
    Entitlement:
      type: object
      description: An entitlement as billing and operators see it. It never carries the license key.
      required: [entitlementId, listingId, buyerRef, source]
      properties:
        entitlementId: { type: string }
        listingId: { type: string }
        buyerRef: { $ref: "#/components/schemas/BuyerRef" }
        source: { $ref: "#/components/schemas/EntitlementSource" }
        revokedAt: { type: string, format: date-time }
        revokedReason: { type: string, enum: [refund, dispute, operator] }
    AdminEntitlement:
      type: object
      required: [id, listingId, buyerRef, source, grantedAt, revokedAt, revokedReason, paymentAttached, activationCount]
      properties:
        id: { type: string }
        listingId: { type: string }
        buyerRef: { $ref: "#/components/schemas/BuyerRef" }
        source: { $ref: "#/components/schemas/EntitlementSource" }
        grantedAt: { type: string, format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
        revokedReason: { type: ["string", "null"], enum: [refund, dispute, operator, null] }
        paymentAttached: { type: boolean }
        activationCount: { type: integer }

    AuthorLink:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label: { type: string }
        url: { type: string }
    ImageUrlRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, description: A public https image for the server to fetch. }
    FeaturedRequest:
      type: object
      additionalProperties: false
      required: [rank]
      properties:
        rank: { type: integer, minimum: 0, description: Lower ranks show first. }
    ModuleResponse:
      type: object
      required: [module]
      properties:
        module: { $ref: "#/components/schemas/ModuleDetail" }
    ModuleUpload:
      type: object
      required: [module, uploadUrl, expiresAt]
      properties:
        module: { $ref: "#/components/schemas/ModuleDetail" }
        uploadUrl: { type: string, description: A signed PUT for the archive. }
        expiresAt: { type: string, format: date-time }
        submissionId: { type: string, description: Present when the build will wait for review. }
    CreateModuleRequest:
      type: object
      additionalProperties: false
      required: [id, name, authorSlug]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,62}$", description: "The listing id. For edition n after the first it is `{moduleKey}-v{n}`." }
        moduleKey: { type: string, description: The manifest id every edition shares. Defaults to id. }
        edition: { type: integer, description: Defaults to 1. }
        name: { type: string, minLength: 1 }
        authorSlug: { type: string, description: The username the module is published under. A publisher token may only name itself. }
        description: { type: [string, "null"] }
        author: { type: [string, "null"] }
        version: { type: [string, "null"] }
        category: { type: [string, "null"] }
    UpdateModuleRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        authorSlug: { type: [string, "null"], description: Reattributes the module when sent. }
        description: { type: [string, "null"] }
        author: { type: [string, "null"] }
        version: { type: [string, "null"] }
        category: { type: [string, "null"] }
    ListingStatus:
      type: string
      enum: [pending, ready]
    Listing:
      type: object
      description: A light listing as stored, not the catalog's composed view.
      required: [id, type, name, tags, images, tier, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/ListingType" }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        author: { type: string }
        authorSlug: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        payload:
          type: object
          additionalProperties: true
          description: An emote pack's renditions or an overlay or alert's bundle. Only a service token sees it.
        iconUrl: { type: string }
        images: { $ref: "#/components/schemas/ImageSet" }
        featuredRank: { type: integer }
        tier: { type: string, enum: [public, dev] }
        sha256: { type: string }
        sizeBytes: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/ListingStatus" }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ListingResponse:
      type: object
      required: [listing]
      properties:
        listing: { $ref: "#/components/schemas/Listing" }
    CreateListingRequest:
      type: object
      additionalProperties: false
      required: [id, type, name, authorSlug]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,62}$" }
        type: { type: string, enum: [emote, overlay, alert], description: "A module or theme is published through /modules." }
        name: { type: string, minLength: 1 }
        authorSlug: { type: string, description: The username the listing is published under. }
        description: { type: [string, "null"] }
        author: { type: [string, "null"] }
        version: { type: [string, "null"] }
        category: { type: [string, "null"] }
        tags: { type: [array, "null"], items: { type: string } }
        tier: { type: string, enum: [public, dev, ""], description: Defaults to public. }
        bundle: { type: [object, "null"], additionalProperties: true, description: "Required for an overlay or alert: the scenes or alert composition document it installs. Opaque to this service." }
        requires: { type: [array, "null"], items: { type: string }, description: The modules the bundle's widgets come from. }
    UpdateListingRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        authorSlug: { type: [string, "null"], description: Reattributes the listing when sent. }
        description: { type: [string, "null"] }
        author: { type: [string, "null"] }
        version: { type: [string, "null"] }
        category: { type: [string, "null"] }
        tags: { type: [array, "null"], items: { type: string } }
        bundle: { type: [object, "null"], additionalProperties: true, description: Replaces an overlay or alert's bundle when non-empty. }
        requires: { type: [array, "null"], items: { type: string } }
    CreditInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        role: { type: [string, "null"] }
        url: { type: [string, "null"], description: http or https. }
        avatarUrl: { type: [string, "null"], description: http or https. }
        note: { type: [string, "null"] }
        sortOrder: { type: integer, description: Defaults to the item's position. }
    CreditsRequest:
      type: object
      additionalProperties: false
      properties:
        credits: { type: [array, "null"], items: { $ref: "#/components/schemas/CreditInput" } }
    CreditsResponse:
      type: object
      required: [credits]
      properties:
        credits: { type: array, items: { $ref: "#/components/schemas/Credit" } }
    PreviewInput:
      type: object
      additionalProperties: false
      required: [kind, url]
      properties:
        kind: { type: string, enum: [image, video, live] }
        url: { type: string, minLength: 1 }
        caption: { type: [string, "null"] }
        sortOrder: { type: integer, description: Defaults to the item's position. }
    PreviewsRequest:
      type: object
      additionalProperties: false
      properties:
        previews: { type: [array, "null"], items: { $ref: "#/components/schemas/PreviewInput" } }
    PricingRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [free, paid], description: "Required: a listing is never free by leaving something out." }
        amountCents: { type: integer, format: int64, description: Required and positive for a paid listing; zero or absent for a free one. }
        currency: { type: string, description: Only usd is billed. Defaults to usd. }
        upgrade:
          type: [object, "null"]
          additionalProperties: false
          required: [mode]
          description: What an account holding an earlier edition pays. Absent means the full price.
          properties:
            mode: { type: string, enum: [full, discount, free] }
            amountCents: { type: integer, format: int64, description: For a discount only; below amountCents. }
    PricingResponse:
      type: object
      required: [pricing]
      properties:
        pricing: { $ref: "#/components/schemas/Pricing" }
    Availability:
      type: string
      enum: [listed, dev_only, disabled]
    AdminModule:
      type: object
      description: A module row as operators see it, whatever the catalog hides.
      required: [id, moduleKey, edition, name, version, author, authorSlug, listingType, tier, availability, downloadsBlocked, status, supersededBy, featuredRank, images, publishedAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        moduleKey: { type: string }
        edition: { type: integer }
        name: { type: string }
        version: { type: [string, "null"] }
        author: { type: [string, "null"] }
        authorSlug: { type: [string, "null"] }
        listingType: { type: string, enum: [module, theme] }
        tier: { type: string, enum: [public, dev] }
        availability: { $ref: "#/components/schemas/Availability" }
        downloadsBlocked: { type: boolean }
        status: { type: string, enum: [pending, ready] }
        supersededBy: { type: [string, "null"] }
        featuredRank: { type: [integer, "null"] }
        images: { $ref: "#/components/schemas/ImageSet" }
        publishedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminAction:
      type: object
      required: [id, at, actor, reason, action, targetType, targetId, detail]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string }
        reason: { type: string }
        action: { type: string, description: "What was done, such as `module.availability.set`." }
        targetType: { type: string }
        targetId: { type: string }
        detail: { description: "What the handler recorded about the change: any JSON value." }
    SubmissionStatus:
      type: string
      enum: [awaiting_upload, pending, approved, rejected, superseded]
    Submission:
      type: object
      required: [id, moduleId, publisherSlug, status, name, version, tier, sha256, sizeBytes, createdAt, submittedAt, reviewedAt, reviewedBy, reviewReason]
      properties:
        id: { type: string }
        moduleId: { type: string }
        publisherSlug: { type: string }
        status: { $ref: "#/components/schemas/SubmissionStatus" }
        name: { type: [string, "null"] }
        version: { type: [string, "null"] }
        tier: { type: [string, "null"], enum: [public, dev, null] }
        sha256: { type: [string, "null"] }
        sizeBytes: { type: [integer, "null"], format: int64 }
        createdAt: { type: string, format: date-time }
        submittedAt: { type: [string, "null"], format: date-time }
        reviewedAt: { type: [string, "null"], format: date-time }
        reviewedBy: { type: [string, "null"] }
        reviewReason: { type: [string, "null"] }
    ArchiveManifest:
      type: object
      required: [path, text]
      properties:
        path: { type: string }
        text: { type: string }
    SubmissionDetail:
      type: object
      required: [submission, manifest, readme, live, pricing]
      properties:
        submission: { $ref: "#/components/schemas/Submission" }
        module:
          $ref: "#/components/schemas/AdminModule"
          description: Absent when the module no longer exists.
        manifest:
          description: The submitted manifest of a pending submission, null once decided.
          anyOf:
            - $ref: "#/components/schemas/ArchiveManifest"
            - type: "null"
        readme: { type: [string, "null"] }
        live:
          description: The build the module serves now, or null for a first publish.
          anyOf:
            - type: object
              required: [version, sha256, manifest]
              properties:
                version: { type: [string, "null"] }
                sha256: { type: [string, "null"] }
                manifest:
                  anyOf:
                    - $ref: "#/components/schemas/ArchiveManifest"
                    - type: "null"
            - type: "null"
        pricing:
          anyOf:
            - $ref: "#/components/schemas/Pricing"
            - type: "null"
    Gross:
      type: object
      description: Cents by currency.
      additionalProperties: { type: integer, format: int64 }
    DailyStats:
      type: object
      required: [day, downloads, installs, purchases, gross]
      properties:
        day: { type: string, description: "A UTC date, YYYY-MM-DD." }
        downloads: { type: integer }
        installs: { type: integer }
        purchases: { type: integer }
        gross: { $ref: "#/components/schemas/Gross" }
    Publisher:
      type: object
      required: [slug, trusted, active, createdAt, disabledAt, tokens]
      properties:
        slug: { type: string }
        trusted: { type: boolean }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: [string, "null"], format: date-time }
        tokens:
          type: array
          items:
            type: object
            required: [id, createdAt, revokedAt]
            properties:
              id: { type: integer, format: int64 }
              createdAt: { type: string, format: date-time }
              revokedAt: { type: [string, "null"], format: date-time }
    AdminGrant:
      type: object
      required: [outcome, entitlement]
      properties:
        outcome: { type: string, enum: [granted, reinstated, already_held] }
        entitlement: { $ref: "#/components/schemas/AdminEntitlement" }
