      parameters:
        - { $ref: "#/components/parameters/AdminActor" }
        - { $ref: "#/components/parameters/AdminReason" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditsRequest" }
      responses:
        "200":
          description: The credits as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/modules/{id}/availability:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    put:
      tags: [admin]
      operationId: adminSetAvailability
      summary: List, restrict or delist a module, and block or unblock its downloads
      description: Both fields are required, so a request always states the state it leaves the module in.
      security:
        - adminBearer: []
      parameters:
        - { $ref: "#/components/parameters/AdminActor" }
        - { $ref: "#/components/parameters/AdminReason" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [availability, downloadsBlocked]
              properties:
                availability: { $ref: "#/components/schemas/Availability" }
                downloadsBlocked: { type: boolean }
      responses:
