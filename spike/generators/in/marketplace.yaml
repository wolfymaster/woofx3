openapi: 3.1.0
info:
  title: woofx3 marketplace API
  version: 1.0.0
  description: |
    Every JSON route the marketplace serves: the catalog, acquiring and
    entitlements, publishing (modules and the light listing types), the
    billing module's purchase-intent routes and the operator's /admin routes.

    This file is the contract and is written by hand. The service embeds it:
    it checks at startup that every served route is documented, and it refuses
    a request to a documented route that does not fit it (unknown body fields
    included) with 400 invalid_request, after the caller has authenticated.
    Its tests (internal/httpapi/openapi_test.go and the contract router every
    handler test goes through) check that every answer the handlers send fits
    the schema documented for that status. Routes that serve bytes rather than
    JSON (images, emotes) and /healthz are not described here.

    Every error answers the same envelope (Error) with a code from ErrorCode.
    Reads are open unless an operation lists a credential under `security`; a
    read may carry any credential, and one that matches nothing is 401.
servers:
  - url: https://marketplace.woofx3.tv
    description: Production. Local and preview deployments use their own origin.
tags:
  - name: catalog
  - name: commerce
  - name: billing
  - name: modules
  - name: listings
  - name: admin

security:
  - {}
  - devBearer: []
  - serviceBearer: []
  - buyerBearer: []
  - publisherBearer: []

paths:
  /catalog:
    get:
      tags: [catalog]
      operationId: searchCatalog
      summary: Search the catalog across every listing type
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: author, in: query, description: An author username., schema: { type: string } }
        - name: type
          in: query
          description: Listing types to include (module, theme, emote, overlay, alert). Repeatable and comma separated. An unknown type is a 400.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, newest, name, popular, trending]
            default: relevance
        - { name: featured, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of listings.
          content:
            application/json:
              schema:
                type: object
                required: [listings, total, limit, offset]
                properties:
                  listings: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /catalog/counts:
    get:
      tags: [catalog]
      operationId: catalogCounts
      summary: How many listings of each type the catalog holds
      responses:
        "200":
          description: Every type is present, including one with nothing in it.
          content:
            application/json:
              schema:
                type: object
                required: [counts, total]
                properties:
                  counts:
                    type: object
                    required: [module, theme, emote, overlay, alert]
                    properties:
                      module: { type: integer }
                      theme: { type: integer }
                      emote: { type: integer }
                      overlay: { type: integer }
                      alert: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /catalog/{id}:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    get:
      tags: [catalog]
      operationId: getCatalogEntry
      summary: One listing with everything its storefront page shows
      description: |
        A dev-tier or unpublished listing answers 404 unless the caller carries
        a credential that reveals them.
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema:
                type: object
                required: [listing]
                properties:
                  listing: { $ref: "#/components/schemas/CatalogDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /catalog/{id}/bundle:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    get:
      tags: [catalog]
      operationId: getCatalogBundle
      summary: The scene or alert composition an overlay or alert listing installs
      description: |
        Open for a listing priced free. A paid or unpriced listing is served
        only to a control-plane caller or a buyer token, for an account that
        holds it; a control-plane caller names the account in `buyerRef`.
      security:
        - {}
        - serviceBearer: []
        - buyerBearer: []
      parameters:
        - { $ref: "#/components/parameters/BuyerRef" }
      responses:
        "200":
          description: The bundle and the modules its widgets come from.
          content:
            application/json:
              schema:
                type: object
                required: [bundle, requires]
                properties:
                  bundle: { type: object, additionalProperties: true }
                  requires: { type: array, items: { type: string } }
        "400":
          description: The listing is not an overlay or an alert (listing_type_mismatch), or buyerRef is missing (invalid_request).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: The account does not hold the listing (not_entitled) or the buyerRef is another account's (buyer_mismatch).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /catalog/{id}/acquire:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    post:
      tags: [commerce]
      operationId: acquireListing
      summary: Settle what an account must do to hold a listing
      description: |
        A listing that costs nothing for this account is claimed: the
        entitlement is recorded and its license is returned (201 for a new
        claim, 200 for one already held). A paid quote answers 402 with the
        purchase intent the billing module charges against. A caller with no
        credential may claim a free listing only, rate limited per client
        address.

        With a service token the body must name the account in `buyerRef`;
        with a buyer token the account is the token's, and a different
        `buyerRef` is refused with 403 buyer_mismatch.
      security:
        - {}
        - serviceBearer: []
        - buyerBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                buyerRef: { $ref: "#/components/schemas/BuyerRef" }
      responses:
        "200":
          description: The account already held the listing.
          content: { application/json: { schema: { $ref: "#/components/schemas/Acquired" } } }
        "201":
          description: A free listing, or a free upgrade, was claimed.
          content: { application/json: { schema: { $ref: "#/components/schemas/Acquired" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: A bad credential (unauthorized), or a paid listing asked for with no account (account_required).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "402":
          description: The listing costs money for this account. Pay the intent.
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentRequired" } } }
        "403":
          description: The buyerRef is another account's (buyer_mismatch), or the account's access was revoked (entitlement_revoked).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The listing cannot be acquired now (listing_unavailable).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "410":
          description: Downloads of the module are blocked (downloads_blocked).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "429":
          description: Too many anonymous claims from this address (rate_limited). Retry-After says when to ask again.
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds. }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "500": { $ref: "#/components/responses/Error" }
  /catalog/{id}/entitlement:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    get:
      tags: [commerce]
      operationId: getEntitlement
      summary: Whether an account holds a listing
      security:
        - serviceBearer: []
        - buyerBearer: []
      parameters:
        - { $ref: "#/components/parameters/BuyerRef" }
      responses:
        "200":
          description: Held or not. `source` and `grantedAt` are present only when entitled.
          content:
            application/json:
              schema:
                type: object
                required: [entitled]
                properties:
                  entitled: { type: boolean }
                  source: { $ref: "#/components/schemas/EntitlementSource" }
                  grantedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /catalog/{id}/quote:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    get:
      tags: [commerce]
      operationId: getQuote
      summary: What an account must do to hold a listing
      security:
        - serviceBearer: []
        - buyerBearer: []
      parameters:
        - { $ref: "#/components/parameters/BuyerRef" }
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                type: object
                required: [quote]
                properties:
                  quote: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /catalog/{id}/credits:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    put:
      tags: [catalog]
      operationId: putCredits
      summary: Replace the whole list of streamers a listing credits
      description: |
        The order is part of the showcase, so the list is replaced as a whole;
        an empty list clears it. Any listing id is accepted, module or not.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditsRequest" }
      responses:
        "200":
          description: The credits as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /catalog/{id}/previews:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    put:
      tags: [catalog]
      operationId: putPreviews
      summary: Replace the whole list of previews a listing shows before install
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewsRequest" }
      responses:
        "200":
          description: The previews as stored.
          content:
            application/json:
              schema:
                type: object
                required: [previews]
                properties:
                  previews: { type: array, items: { $ref: "#/components/schemas/Preview" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /catalog/{id}/pricing:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    put:
      tags: [catalog]
      operationId: putPricing
      summary: Set how a listing is acquired, replacing its pricing whole
      description: |
        The amounts are what a purchase intent quotes and billing charges. An
        emote pack cannot be priced (409 not_sellable). Operators set the same
        pricing, audited, through /admin/listings/{id}/pricing.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PricingRequest" }
      responses:
        "200":
          description: The pricing as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /entitlements:
    get:
      tags: [commerce]
      operationId: listEntitlements
      summary: Every listing an account holds, with its license keys
      security:
        - serviceBearer: []
        - buyerBearer: []
      parameters:
        - { $ref: "#/components/parameters/BuyerRef" }
      responses:
        "200":
          description: The held listing ids, and a key for each entitlement whose key could be read.
          content:
            application/json:
              schema:
                type: object
                required: [listingIds, licenses]
                properties:
                  listingIds: { type: array, items: { type: string } }
                  licenses:
                    type: array
                    items:
                      type: object
                      required: [listingId, source, key]
                      properties:
                        listingId: { type: string }
                        source: { $ref: "#/components/schemas/EntitlementSource" }
                        key: { type: string, description: The license key. Secret. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /authors/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [catalog]
      operationId: getAuthor
      summary: An author's page header and one page of their listings
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: The author, claimed or not, and their listings, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [author, listings, total, limit, offset]
                properties:
                  author: { $ref: "#/components/schemas/Author" }
                  listings: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      tags: [catalog]
      operationId: putAuthor
      summary: Claim or update an author profile
      description: Sets the whole profile, so a field is cleared by leaving it out.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string }
                bio: { type: [string, "null"] }
                avatarUrl: { type: [string, "null"] }
                links:
                  type: [array, "null"]
                  items: { $ref: "#/components/schemas/AuthorLink" }
      responses:
        "200":
          description: The profile as stored.
          content:
            application/json:
              schema:
                type: object
                required: [author]
                properties:
                  author: { $ref: "#/components/schemas/Author" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /modules:
    get:
      tags: [modules]
      operationId: listModules
      summary: Every ready module and theme
      responses:
        "200":
          description: The modules, with counts of what each carries instead of the full arrays.
          content:
            application/json:
              schema:
                type: object
                required: [modules]
                properties:
                  modules: { type: array, items: { $ref: "#/components/schemas/ModuleListItem" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      tags: [modules]
      operationId: createModule
      summary: Open a module or a new edition, answering where to PUT its archive
      description: |
        For a later edition the id must be `{moduleKey}-v{edition}`. A publisher
        token publishes only under its own name. A publisher whose builds need
        review gets a staging key and a `submissionId`.
      security:
        - serviceBearer: []
        - publisherBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateModuleRequest" }
      responses:
        "201":
          description: The module, pending, and where to PUT its archive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleUpload" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /modules/{id}:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    get:
      tags: [modules]
      operationId: getModule
      summary: One module or theme with its manifest contents
      responses:
        "200":
          description: The module.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      tags: [modules]
      operationId: updateModule
      summary: Update a module's editable metadata
      description: The manifest's contents come from re-uploading, not from here.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateModuleRequest" }
      responses:
        "200":
          description: The module as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      tags: [modules]
      operationId: deleteModule
      summary: Delete a module, its archive and every rendition
      security:
        - serviceBearer: []
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /modules/{id}/download:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    get:
      tags: [modules]
      operationId: downloadModule
      summary: A short-lived signed URL for a module's archive
      description: |
        A module priced free downloads with no credential. Otherwise the caller
        presents either an `X-License-Key` (with `X-Install-Id`; a key from a
        purchase, upgrade or grant also needs the account's buyer token or a
        service token naming it in `buyerRef`), or a service or buyer token for
        an account that holds the listing.
      security:
        - {}
        - serviceBearer: []
        - buyerBearer: []
      parameters:
        - { $ref: "#/components/parameters/BuyerRef" }
        - name: X-License-Key
          in: header
          schema: { type: string }
        - name: X-Install-Id
          in: header
          description: Required with X-License-Key; at most 128 characters (otherwise 400 install_id_required).
          schema: { type: string }
      responses:
        "200":
          description: The signed URL. `sha256` and `sizeBytes` are absent for a module published before they were recorded.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  sha256: { type: string }
                  sizeBytes: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The module is not ready (module_not_ready), or the license key is used on as many installs as it allows (activation_limit).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "410": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /modules/{id}/upload-url:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    post:
      tags: [modules]
      operationId: moduleUploadUrl
      summary: A fresh signed PUT for the module's next build
      description: |
        Leaves the row alone, so the current build keeps serving until
        `complete` swaps it. A publisher whose builds need review gets a
        staging key and a `submissionId`.
      security:
        - serviceBearer: []
        - publisherBearer: []
      responses:
        "200":
          description: Where to PUT the archive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleUpload" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /modules/{id}/complete:
    parameters:
      - { $ref: "#/components/parameters/ListingId" }
    post:
      tags: [modules]
      operationId: completeModule
      summary: Read the uploaded archive and publish it
      description: |
        Idempotent on content: bytes already published answer 200 and change
        nothing. A build from a publisher that needs review is filed for an
        operator and answers 202.
      security:
        - serviceBearer: []
        - publisherBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sha256: { type: string, description: The hex SHA-256 of the archive the client uploaded; the server waits until the store returns those bytes. }
      responses:
        "200":
          description: The module as published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleResponse" }
        "202":
          description: The build is waiting for an operator's review.
          content:
            application/json:
              schema:
                type: object
                required: [submission, module]
                properties:
                  submission: { $ref: "#/components/schemas/Submission" }
                  module: { $ref: "#/components/schemas/ModuleDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /modules/{id}/images/{slot}:
