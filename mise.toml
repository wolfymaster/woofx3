# Toolchains for building and testing every package in this repository.
# Versions follow CI (.github/workflows): Go 1.25, Rust stable, the Bun pinned
# by the engine image, and the biome pinned by scripts/format.sh.
#
#   mise install      # once per machine; worktrees reuse the same installs

[tools]
go = "1.25"
rust = { version = "stable", components = "clippy,rustfmt" }
bun = "1.3.14"
# prost-build (via shared/clients/rust/db) runs protoc at build time.
protoc = "latest"
biome = "2.4.10"
sccache = "latest"
buf = "1.47.2"
process-compose = "1.46.0"

[env]
# Every worktree gets its own target/, so registry crates would otherwise be
# recompiled once per worktree. sccache caches compiler output by content
# across all of them.
RUSTC_WRAPPER = "sccache"
SCCACHE_CACHE_SIZE = "20G"
# Bounded so that a few agents building at once stay inside memory.
CARGO_BUILD_JOBS = "3"
