version: "0.5"

environment:
  - "FORCE_COLOR=1"

processes:
  api:
    command: bun run dev
    description: woofx3 API
    working_dir: api

  barkloader:
    command: cargo build -p barkloader && RUST_LOG=info ./target/debug/barkloader
    description: Plugin Module System
    working_dir: barkloader
    shutdown:
      signal: 15
      timeout_seconds: 10
    # log_location: logs/barkloader.log

  cloudflare:
    command: cloudflared tunnel --url https://api.dev.woofx3.tv --http-host-header api.dev.woofx3.tv
    disabled: true

  db:
    command: go run .
    description: proxy for accessing databases
    working_dir: db

  messagebus:
    command: GO_ENV=development go run .
    description: communication message bus
    working_dir: services/nats

  sceneManager:
    command: bun run dev
    description: Overlays & Stream software
    working_dir: sceneManager

  twitch:
    command: bun run src/api.ts
    description: Twitch API + Eventbus
    working_dir: twitch

  workflow:
    command: go run .
    description: Workflow Management
    working_dir: workflow

  woofwoofwoof:
    command: bun run src/woofwoofwoof.ts
    description: Twitch Chatbot
    working_dir: woofwoofwoof
