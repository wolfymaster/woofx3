# Runs every service on the host, each reading the repository's .woofx3.json
# and .env. Nothing here generates engine secrets the way the orchestrator
# does: the message bus refuses to start, and its clients are refused,
# unless messagebusToken in .woofx3.json (or WOOFX3_MESSAGEBUS_TOKEN in .env)
# holds a random value of at least 32 bytes, for example from
# `openssl rand -hex 32`.

version: "0.5"

environment:
  - "FORCE_COLOR=1"

processes:
  api:
    command: bun run dev
    description: woofx3 API
    working_dir: api

  barkloader:
    command: cargo build -p barkloader && RUST_LOG=info ./target/debug/barkloader
    description: Plugin Module System
    working_dir: barkloader
    shutdown:
      signal: 15
      timeout_seconds: 10
    # log_location: logs/barkloader.log

  cloudflare:
    command: cloudflared tunnel --url http://127.0.0.1:5050 --http-host-header api.dev.woofx3.tv
    disabled: true

  connectors:
    command: bun run src/server.ts
    description: Platform and local connections (Twitch)
    working_dir: connectors

  db:
    command: go run .
    description: proxy for accessing databases
    working_dir: db

  messagebus:
    command: GO_ENV=development go run .
    description: communication message bus
    working_dir: services/nats

  sceneManager:
    command: bun run dev
    description: Overlays & Stream software
    working_dir: sceneManager

  workflow:
    command: go run .
    description: Workflow Management
    working_dir: workflow
