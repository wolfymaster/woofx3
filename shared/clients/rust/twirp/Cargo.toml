[package]
name = "woofx3-twirp"
version = "0.1.0"
edition = "2024"
description = "Twirp RPC client for woofx3 services"

[dependencies]
woofx3 = { path = "../db" }
woofx3-logging = { path = "../../../common/rust/logging" }
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"

[dev-dependencies]
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["testing", "metrics", "trace"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
tokio = { version = "1", features = ["rt", "net", "macros", "io-util"] }
