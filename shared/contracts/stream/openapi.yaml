openapi: 3.1.0
info:
  title: Streaming platform events
  version: 1.0.0
  description: >
    Events the connectors publish from a streaming platform. Each operation path
    is the NATS subject; the event's `type` is that same subject. The platform an
    event came from is the `platform` attribute, so the subjects carry no platform
    name. A field the platform can lack is required and nullable, never omitted:
    a workflow condition reads `null` where it would fail on a missing key.
paths:
  /user.message:
    post:
      operationId: userMessage
      summary: Published by connectors on user.message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserMessageEvent"
      responses:
        "200":
          description: Published without a reply; the bus sends none.
  /chat.command.{slug}:
    post:
      operationId: chatCommand
      summary: >
        Published on `chat.command.<slug>` for each invocation of a chat command: by connectors when a
        viewer types it, by the api when the dashboard runs it, and by the workflow engine when a
        `command.run` step runs it.
      parameters:
        - name: slug
          in: path
          required: true
          description: The command's name without its `!`, lowercase.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCommandEvent"
      responses:
        "200":
          description: Published without a reply; the bus sends none.
