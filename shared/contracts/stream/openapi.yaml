        chatterName:
          type: string
        chatterIsAnonymous:
          type: boolean
        messageId:
          type: string
        messageText:
          type: string
        sourceBroadcasterId:
          type: [string, "null"]
        sourceBroadcasterName:
          type: [string, "null"]
        broadcasterId:
          type: string
        broadcasterName:
          type: string
        tier:
          type: string
    ChannelUnraid:
      description: A raid was cancelled.
      type: object
      additionalProperties: false
      required: [chatterId, chatterName, chatterIsAnonymous, messageId, messageText, sourceBroadcasterId, sourceBroadcasterName, broadcasterId, broadcasterName]
      properties:
        chatterId:
          type: string
        chatterName:
          type: string
        chatterIsAnonymous:
          type: boolean
        messageId:
          type: string
        messageText:
          type: string
        sourceBroadcasterId:
          type: [string, "null"]
        sourceBroadcasterName:
          type: [string, "null"]
        broadcasterId:
          type: string
        broadcasterName:
          type: string
    ChannelPayItForward:
      description: A viewer paid forward a gift they received.
      type: object
      additionalProperties: false
      required: [chatterId, chatterName, chatterIsAnonymous, messageId, messageText, sourceBroadcasterId, sourceBroadcasterName, broadcasterId, broadcasterName, isGifterAnonymous, gifterId, gifterName]
      properties:
        chatterId:
