        sourceBroadcasterId:
          type: [string, "null"]
        sourceBroadcasterName:
          type: [string, "null"]
        broadcasterId:
          type: string
        broadcasterName:
          type: string
        isGifterAnonymous:
          type: boolean
        gifterId:
          type: [string, "null"]
        gifterName:
          type: [string, "null"]
    ChannelAnnouncement:
      description: An announcement posted in chat.
      type: object
      additionalProperties: false
      required: [chatterId, chatterName, chatterIsAnonymous, messageId, messageText, sourceBroadcasterId, sourceBroadcasterName, broadcasterId, broadcasterName, color]
