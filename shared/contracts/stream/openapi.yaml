components:
  schemas:
    PlatformId:
      description: The streaming platform an event came from.
      type: string
      enum: [twitch]
    WorkflowChain:
      description: >
        Comma-separated ids of the workflow runs that led to the event, oldest
        first; at most 8 ids of 200 characters.
      type: string
      minLength: 1
      maxLength: 1607
    ChatterMembership:
      description: >
        Platform membership of a chat message's author, neutral across platforms.
        `isFollower` and `subscriberTier` are absent when the platform does not
        report them or the lookup did not resolve; absent is never `false` or a
        default tier.
      type: object
      additionalProperties: false
      required: [isBroadcaster, isModerator, isSubscriber, isVip]
      properties:
        isBroadcaster:
          type: boolean
        isModerator:
          type: boolean
        isSubscriber:
          type: boolean
        isVip:
          type: boolean
        isFollower:
          type: boolean
        subscriberTier:
          description: A neutral token such as `tier1`, never a platform's own code.
          type: string
    HypeTrainContribution:
      description: What a viewer put into a hype train.
      type: object
      additionalProperties: false
      required: [userId, userName, type, total]
      properties:
        userId:
          type: string
        userName:
          type: string
        type:
          type: string
          enum: [bits, subscription, other]
        total:
          description: Points. Bits count one each, a subscription counts by tier.
          type: integer
    UserMessage:
      description: A line said in chat, by a viewer or by the engine itself.
      type: object
      additionalProperties: false
      required: [messageId, amount, isPaid, channelId, channelName, chatterId, chatterName, chatterLogin, message, membership, fromEngine]
      properties:
        messageId:
          type: string
        amount:
          type: integer
        isPaid:
          type: boolean
        channelId:
          type: [string, "null"]
        channelName:
          type: [string, "null"]
        chatterId:
          type: string
        chatterName:
          type: string
        chatterLogin:
          type: string
        message:
          type: string
        membership:
          $ref: "#/components/schemas/ChatterMembership"
        fromEngine:
          type: boolean
    ChannelCheer:
      description: Bits cheered in the channel.
      type: object
      additionalProperties: false
      required: [amount, isAnonymous, message, userId, userName]
      properties:
        amount:
          type: integer
        isAnonymous:
          type: boolean
        message:
          type: string
        userId:
          type: [string, "null"]
        userName:
          type: [string, "null"]
    ChannelFollow:
      description: A viewer followed the channel.
      type: object
      additionalProperties: false
      required: [userId, userName]
      properties:
        userId:
          type: string
        userName:
          type: string
    ChannelHypeTrain:
      description: A hype train started.
      type: object
      additionalProperties: false
      required: [id, broadcasterId, broadcasterName, level, total, progress, goal, topContributions, startedAt, expiresAt]
      properties:
        id:
          type: string
        broadcasterId:
          type: string
        broadcasterName:
          type: string
        level:
          type: integer
        total:
          type: integer
        progress:
          type: integer
        goal:
          type: integer
        topContributions:
          type: array
          items:
            $ref: "#/components/schemas/HypeTrainContribution"
        startedAt:
          type: string
        expiresAt:
          type: string
    ChannelRaid:
      description: An incoming raid into the broadcaster's channel.
      type: object
      additionalProperties: false
      required: [fromBroadcasterUserId, fromBroadcasterUserName, viewers]
      properties:
        fromBroadcasterUserId:
          type: string
        fromBroadcasterUserName:
          type: string
        viewers:
          type: integer
    ChannelPointsRedeem:
      description: A channel-points custom reward redemption.
      type: object
      additionalProperties: false
      required: [redeemId, rewardId, rewardTitle, rewardCost, userId, userName]
      properties:
        redeemId:
          type: string
        rewardId:
          type: string
        rewardTitle:
          type: string
        rewardCost:
          type: integer
        userId:
          type: string
        userName:
          type: string
        message:
          type: string
    StreamOnline:
      description: The stream went live.
      type: object
      additionalProperties: false
      required: [broadcasterUserId, broadcasterUserName, startedAt]
      properties:
        broadcasterUserId:
          type: string
        broadcasterUserName:
          type: string
        startedAt:
          type: string
    StreamOffline:
      description: The stream ended.
      type: object
      additionalProperties: false
      required: [broadcasterUserId, broadcasterUserName]
      properties:
        broadcasterUserId:
          type: string
        broadcasterUserName:
          type: string
    ChannelSubscribe:
      description: A subscription, bought or gifted to one named viewer.
      type: object
      additionalProperties: false
      required: [isGift, isCommunityGift, tier, userId, userName]
      properties:
        isGift:
          type: boolean
        isCommunityGift:
          type: boolean
        tier:
          type: string
        userId:
          type: [string, "null"]
        userName:
          type: [string, "null"]
    ChannelSubscriptionGift:
      description: A community gift of subscriptions.
      type: object
      additionalProperties: false
      required: [amount, gifterId, gifterName, isAnonymous, tier]
      properties:
        amount:
          type: integer
        gifterId:
          type: string
        gifterName:
          type: string
        isAnonymous:
          type: boolean
        tier:
          type: string
    ChannelResub:
      description: A resubscription.
      type: object
      additionalProperties: false
      required: [chatterId, chatterName, chatterIsAnonymous, messageId, messageText, sourceBroadcasterId, sourceBroadcasterName, broadcasterId, broadcasterName, tier, isPrime, durationMonths, cumulativeMonths, streakMonths, isGift, gifterIsAnonymous, gifterId, gifterName]
      properties:
        chatterId:
          type: string
        chatterName:
          type: string
        chatterIsAnonymous:
          type: boolean
        messageId:
          type: string
        messageText:
          type: string
        sourceBroadcasterId:
          type: [string, "null"]
        sourceBroadcasterName:
          type: [string, "null"]
        broadcasterId:
          type: string
        broadcasterName:
          type: string
        tier:
          type: string
        isPrime:
          type: boolean
        durationMonths:
          type: integer
        cumulativeMonths:
          type: integer
        streakMonths:
          type: [integer, "null"]
        isGift:
          type: boolean
        gifterIsAnonymous:
          type: [boolean, "null"]
        gifterId:
          type: [string, "null"]
        gifterName:
          type: [string, "null"]
    ChannelGiftPaidUpgrade:
      description: A viewer upgraded a gifted subscription to a paid one.
      type: object
      additionalProperties: false
      required: [chatterId, chatterName, chatterIsAnonymous, messageId, messageText, sourceBroadcasterId, sourceBroadcasterName, broadcasterId, broadcasterName, isGifterAnonymous, gifterId, gifterName]
      properties:
        chatterId:
