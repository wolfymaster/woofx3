[package]
name = "woofx3-cloudevents"
version = "0.1.0"
edition = "2021"

# Deliberately minimal. `lib_sandbox` depends on this crate and carries no
# date/time library, which is why timestamp formatting is implemented here
# rather than pulled in from chrono.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Patterns in the generated contract types.
regress = "0.10"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Validates the shared contract fixtures against the embedded contract documents.
jsonschema = { version = "0.30", default-features = false }
