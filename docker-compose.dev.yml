# Development docker-compose — replaces process-compose for local dev.
# All services share the woofx3-dev base image; source dirs are bind-mounted
# so code changes apply without rebuilding the image.
#
# Services here run in separate containers and reach each other by service
# name, so the ones other containers connect to bind 0.0.0.0 through their
# *_HOST variables. Everywhere else they default to loopback. Ports published
# to the host bind 127.0.0.1: Docker would otherwise publish them on every
# host interface, past the host firewall.
#
# Prerequisites:
#   docker build -f Dockerfile.dev -t woofx3-dev .
#
# Usage:
#   docker compose -f docker-compose.dev.yml up            # all services
#   docker compose -f docker-compose.dev.yml up messagebus db api
#   docker compose -f docker-compose.dev.yml logs -f api
#   docker compose -f docker-compose.dev.yml down -v       # also removes caches

name: woofx3-dev

# Services refuse a missing, placeholder or short engine secret, and nothing
# here generates one the way the orchestrator does, so every service that
# shares barkloaderKey gets this dev-only value, over the one in .woofx3.json.
# Set WOOFX3_BARKLOADER_KEY in .env (at least 32 bytes) to use your own, and
# the same value for any service run outside compose.
x-dev-barkloader-key: &dev-barkloader-key ${WOOFX3_BARKLOADER_KEY:-920b1fd6f0f8b9b7c22e5749d9cc9633eeed42ce4250f5b3df2352249582bc51}

# The message bus refuses to start without a token, and every client must
# present the same one, so every service gets this dev-only value. Set
# WOOFX3_MESSAGEBUS_TOKEN in .env (at least 32 bytes) to use your own.
x-dev-messagebus-token: &dev-messagebus-token ${WOOFX3_MESSAGEBUS_TOKEN:-a1a1e55da81b066ec63a4bdd57293d88db023e073fe10376f04a6f9ac91dbb4f}

# The db proxy refuses callers without its service token, so the db service
# and every service that dials it share this dev-only value. Set
# WOOFX3_DB_PROXY_TOKEN in .env (at least 32 bytes) to use your own.
x-dev-db-proxy-token: &dev-db-proxy-token ${WOOFX3_DB_PROXY_TOKEN:-c4fdfa693dbd3ff5feee0fd342421a1e8d59d0dda8ce1b4d21d58650624caee3}

services:
  messagebus:
    image: woofx3-dev
    restart: unless-stopped
    working_dir: /app/services/nats
    command: go run .
    environment:
      FORCE_COLOR: "1"
      WOOFX3_MESSAGEBUS_TOKEN: *dev-messagebus-token
      GO_ENV: development
      WOOFX3_MESSAGEBUS_HOST: 0.0.0.0
    volumes:
      - ./.woofx3.json:/app/.woofx3.json:ro
      - ./services/nats:/app/services/nats
      - ./shared:/app/shared
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - path: ./.env
        required: false
    ports:
      - "127.0.0.1:4222:4222"
    networks:
      - woofx3

  db:
    image: woofx3-dev
    restart: unless-stopped
    working_dir: /app/db
    command: go run .
    environment:
      FORCE_COLOR: "1"
      WOOFX3_MESSAGEBUS_TOKEN: *dev-messagebus-token
      WOOFX3_MESSAGEBUS_URL: nats://messagebus:4222
      WOOFX3_DATABASE_PROXY_HOST: 0.0.0.0
      # Other containers reach the proxy by this service name.
      WOOFX3_DATABASE_PROXY_ALLOWED_HOSTS: db
      WOOFX3_DB_PROXY_TOKEN: *dev-db-proxy-token
    volumes:
      - ./.woofx3.json:/app/.woofx3.json:ro
      - ./db:/app/db
      - ./shared:/app/shared
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - path: ./.env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - messagebus
    networks:
      - woofx3

  workflow:
    image: woofx3-dev
    restart: unless-stopped
    working_dir: /app/workflow
    command: go run .
    environment:
      FORCE_COLOR: "1"
      WOOFX3_MESSAGEBUS_TOKEN: *dev-messagebus-token
      WOOFX3_MESSAGEBUS_URL: nats://messagebus:4222
      WOOFX3_BARKLOADER_KEY: *dev-barkloader-key
      WOOFX3_DB_PROXY_TOKEN: *dev-db-proxy-token
    volumes:
      - ./.woofx3.json:/app/.woofx3.json:ro
      - ./workflow:/app/workflow
      - ./shared:/app/shared
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - path: ./.env
        required: false
    depends_on:
      - messagebus
      - db
    networks:
      - woofx3

  barkloader:
    image: woofx3-dev
    restart: unless-stopped
    working_dir: /app/barkloader
    command: sh -c "cargo build -p barkloader && RUST_LOG=info ./target/debug/barkloader"
    environment:
      FORCE_COLOR: "1"
      WOOFX3_MESSAGEBUS_TOKEN: *dev-messagebus-token
      RUST_LOG: info
      # Rust runtime reads MESSAGEBUS_URL; WOOFX3_MESSAGEBUS_URL covers any Go/TS paths
      MESSAGEBUS_URL: nats://messagebus:4222
      WOOFX3_MESSAGEBUS_URL: nats://messagebus:4222
      WOOFX3_BARKLOADER_KEY: *dev-barkloader-key
      WOOFX3_DB_PROXY_TOKEN: *dev-db-proxy-token
    volumes:
      - ./.woofx3.json:/app/.woofx3.json:ro
      - ./barkloader:/app/barkloader
      - barkloader-target:/app/barkloader/target
      - ./shared:/app/shared
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
    env_file:
      - path: ./.env
        required: false
    depends_on:
      - messagebus
    networks:
      - woofx3

  api:
    image: woofx3-dev
    restart: unless-stopped
    working_dir: /app/api
    command: sh -c "bun install && bun run dev"
    environment:
      FORCE_COLOR: "1"
      WOOFX3_MESSAGEBUS_TOKEN: *dev-messagebus-token
      WOOFX3_MESSAGEBUS_URL: nats://messagebus:4222
      WOOFX3_API_HOST: 0.0.0.0
      WOOFX3_BARKLOADER_KEY: *dev-barkloader-key
      WOOFX3_DB_PROXY_TOKEN: *dev-db-proxy-token
    volumes:
      - ./.woofx3.json:/app/.woofx3.json:ro
      - ./api:/app/api
      - api-node-modules:/app/api/node_modules
      - ./shared:/app/shared
    env_file:
      - path: ./.env
        required: false
    depends_on:
      - messagebus
      - db
    networks:
      - woofx3

  twitch:
    image: woofx3-dev
    restart: unless-stopped
    working_dir: /app/twitch
    command: sh -c "bun install && bun run src/api.ts"
    environment:
      FORCE_COLOR: "1"
      WOOFX3_MESSAGEBUS_TOKEN: *dev-messagebus-token
      WOOFX3_MESSAGEBUS_URL: nats://messagebus:4222
      WOOFX3_DB_PROXY_TOKEN: *dev-db-proxy-token
    volumes:
      - ./.woofx3.json:/app/.woofx3.json:ro
      - ./twitch:/app/twitch
      - twitch-node-modules:/app/twitch/node_modules
      - ./shared:/app/shared
    env_file:
      - path: ./.env
        required: false
    depends_on:
      - messagebus
    networks:
      - woofx3

  woofwoofwoof:
    image: woofx3-dev
    restart: unless-stopped
    working_dir: /app/woofwoofwoof
    command: sh -c "bun install && bun run src/woofwoofwoof.ts"
    environment:
      FORCE_COLOR: "1"
      WOOFX3_MESSAGEBUS_TOKEN: *dev-messagebus-token
      WOOFX3_MESSAGEBUS_URL: nats://messagebus:4222
      WOOFX3_BARKLOADER_KEY: *dev-barkloader-key
      WOOFX3_DB_PROXY_TOKEN: *dev-db-proxy-token
    volumes:
      - ./.woofx3.json:/app/.woofx3.json:ro
      - ./woofwoofwoof:/app/woofwoofwoof
      - woofwoofwoof-node-modules:/app/woofwoofwoof/node_modules
      - ./shared:/app/shared
    env_file:
      - path: ./.env
        required: false
    depends_on:
      - messagebus
    networks:
      - woofx3

volumes:
  go-mod-cache:
  go-build-cache:
  cargo-registry:
  cargo-git:
  barkloader-target:
  api-node-modules:
  twitch-node-modules:
  woofwoofwoof-node-modules:

networks:
  woofx3:
    driver: bridge
