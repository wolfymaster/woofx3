[package]
name = "lib_sandbox"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
tracing = "0.1"
mlua = { features = ["lua54", "serialize", "vendored"], version = "0.10.3" }
rquickjs = { version = "0.8", features = ["parallel"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
