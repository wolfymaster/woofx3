[package]
name = "lib_sandbox"
edition = "2024"

[dependencies]
woofx3-cloudevents = { path = "../../shared/common/rust/cloudevents" }
woofx3-logging = { path = "../../shared/common/rust/logging" }
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
anyhow = "1.0.98"
tracing = "0.1"
mlua = { features = ["lua54", "serialize", "vendored"], version = "0.10.3" }
rquickjs = { version = "0.10", features = ["parallel"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
url = "2.5"
thiserror = "2.0.12"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"

[dev-dependencies]
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["testing", "metrics", "trace"] }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
