name: Engine image

# Builds the production image and runs it against an empty database, checking
# what a deployed engine has to do and what no unit test can show: migrate
# itself at boot, keep every service but its edge off the network, report
# readiness, and serve the api and sceneManager on one public port.
#
# The checks live in .github/scripts/engine-image-check.sh (and its companion
# engine-edge-check.ts) so they can also be run by hand against any engine.

on:
  pull_request:
    paths:
      - "build/**"
      - "Dockerfile.production"
      - "db/database/migrate/**"
      - ".github/workflows/engine-image.yml"
      - ".github/scripts/engine-image-check.sh"
      - ".github/scripts/engine-edge-check.ts"
  workflow_dispatch:

concurrency:
  group: engine-image-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  IMAGE: woofx3:image-check
  PORT: "8080"
  POSTGRES_PASSWORD: engine-check
  DATABASE_NAME: woofx3_engine_check

jobs:
  check:
    name: Build and check the image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: woofx3
          POSTGRES_PASSWORD: engine-check
          POSTGRES_DB: woofx3_engine_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U woofx3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The edge checks talk to the engine through the repo's own capnweb
      # client, so that package's dependencies have to be present.
      - name: Install the engine client
        run: bun install --frozen-lockfile
        working-directory: shared/clients/typescript/api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Settle what this run checks
        id: run
        run: |
          set -euo pipefail
          # The version the image is built with is the version /ready must
          # report back.
          echo "version=image-check-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # A fresh token per run, so a passing check can only mean the engine
          # compared the one it was given.
          echo "registration_token=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            WOOFX3_VERSION=${{ steps.run.outputs.version }}
            BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the engine and check it
        env:
          IMAGE: ${{ env.IMAGE }}
          PORT: ${{ env.PORT }}
          EXPECTED_VERSION: ${{ steps.run.outputs.version }}
          REGISTRATION_TOKEN: ${{ steps.run.outputs.registration_token }}
          DATABASE_URL: postgres://woofx3:${{ env.POSTGRES_PASSWORD }}@127.0.0.1:5432/${{ env.DATABASE_NAME }}?sslmode=disable
        run: .github/scripts/engine-image-check.sh
