name: service checks

# Type-checks and tests the Bun services other than api: connectors and
# sceneManager. A typecheck nobody runs lets drift pile up unnoticed, such as
# a field the proto stopped accepting, a logger call with the wrong arguments
# or a stale `@client/*` import.
#
# api has its own workflow (api-checks.yml).
#
# Each service resolves its workspace siblings by relative path, so the whole
# workspace is installed, or every shared import fails to resolve and the run
# reports hundreds of phantom errors.

on:
  push:
    branches: [main, master, release]
    paths:
      - "connectors/**"
      - "sceneManager/**"
      - "shared/clients/typescript/**"
      - "shared/common/typescript/**"
      - "shared/common/contracts/**"
      - "services/nats/**"
      - "shared/common/golang/logging/**"
      - ".bun-version"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".github/workflows/service-checks.yml"
  pull_request:
    paths:
      - "connectors/**"
      - "sceneManager/**"
      - "shared/clients/typescript/**"
      - "shared/common/typescript/**"
      - "shared/common/contracts/**"
      - "services/nats/**"
      - "shared/common/golang/logging/**"
      - ".bun-version"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".github/workflows/service-checks.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [connectors, sceneManager]
    steps:
      - uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # sceneManager imports @woofx3/module-sdk by its built output, not its
      # source, so the package has to be compiled before anything type-checks
      # against it.
      - name: Build module-sdk
        run: cd shared/clients/typescript/module-sdk && bun run build

      # sceneManager's smoke suite (tests/smoke) runs the service against the
      # engine's real message bus, a Go program, and fails without it in CI.
      - name: Set up Go
        if: matrix.service == 'sceneManager'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/nats/go.sum

      - name: Build the message bus
        if: matrix.service == 'sceneManager'
        run: |
          cd services/nats && go build -o "$RUNNER_TEMP/messagebus" .
          echo "WOOFX3_MESSAGEBUS_BIN=$RUNNER_TEMP/messagebus" >> "$GITHUB_ENV"

      - name: Type check
        working-directory: ${{ matrix.service }}
        run: bun run typecheck

      - name: Test
        working-directory: ${{ matrix.service }}
        run: bun test

      # The overlay page's frame and bridge code lives in its own package, so
      # the author preview can host widgets with it too; it is checked with
      # the service that serves it.
      - name: Type check the widget-host package
        if: matrix.service == 'sceneManager'
        working-directory: shared/clients/typescript/widget-host
        run: bun run typecheck

      - name: Test the widget-host package
        if: matrix.service == 'sceneManager'
        working-directory: shared/clients/typescript/widget-host
        run: bun test
