name: go checks

# Builds and tests the Go modules. Nothing ran `go test` on CI before this,
# so the db-proxy - the only service that talks to a data store - and the
# workflow engine were verified only on whoever's machine last touched them.
#
# One job per module because each is its own `go.mod` reached by `replace`
# directives, so building one does not build, let alone test, the others.
# Modules with no tests are still built: a compile break in a generated
# client or a service entry point is worth catching, and `go build` is cheap.

on:
  push:
    branches: [main, master, release]
    paths:
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".github/workflows/go-checks.yml"
  pull_request:
    paths:
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".github/workflows/go-checks.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module:
          - db
          - workflow
          - services/nats
          - build/orchestrator
          - shared/clients/golang/barkloader
          - shared/clients/golang/db
          - shared/clients/golang/nats
          - shared/clients/golang/servicediscovery
          - shared/common/golang/cloudevents
          - shared/common/golang/conditions
          - shared/common/golang/config
          - shared/common/golang/logging
          - shared/common/golang/runtime
    steps:
      - uses: actions/checkout@v4

      # The version mise.toml pins, so CI runs what developers run. Reading
      # each module's own `go` directive instead would test most of them on
      # 1.23, which nobody uses and which several already exceed.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  # The postgres migration tests skip without a database to run against, so
  # the check job above only proves them against sqlite. This one gives them a
  # throwaway postgres: the dialect-specific SQL (jsonb casts and scans,
  # INSERT ... SELECT copies) is only exercised here.
  postgres-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: woofx3
          POSTGRES_PASSWORD: migration-test
          POSTGRES_DB: woofx3_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U woofx3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: db/go.sum

      # One package at a time: every test in it clears the shared database
      # when it ends and refuses to start on one that is not empty.
      - name: Test postgres migrations
        working-directory: db
        env:
          WOOFX3_MIGRATION_TEST_POSTGRES_URL: postgres://woofx3:migration-test@127.0.0.1:5432/woofx3_migration_test?sslmode=disable
        run: go test -p 1 -count=1 ./database/migrate/migrations/postgres/...

      # The Postgres cases of the db services, repositories and models
      # (everything run through dbtest.ForEachDialect) skip without the
      # database URL, so they run here too. The first grep fails the step if
      # any case skipped for want of the URL; a case that skips one dialect on
      # purpose says why and is not caught. The last three prove the
      # services, repository and models packages really reached Postgres.
      - name: Test db services against postgres
        working-directory: db
        shell: bash
        env:
          WOOFX3_MIGRATION_TEST_POSTGRES_URL: postgres://woofx3:migration-test@127.0.0.1:5432/woofx3_migration_test?sslmode=disable
        run: |
          go test -p 1 -count=1 -v ./app/services/... ./database/repository/... ./database/models/... | tee "$RUNNER_TEMP/services.log"
          if grep -F -- 'WOOFX3_MIGRATION_TEST_POSTGRES_URL not set' "$RUNNER_TEMP/services.log"; then
            echo "a Postgres case skipped without the database URL"
            exit 1
          fi
          grep -E -- '--- PASS: TestCountAlertsByHourCountsEachHourByOutcome/postgres' "$RUNNER_TEMP/services.log"
          grep -E -- '--- PASS: TestSettingWritesInsertNewRowsOnEveryDialect/postgres' "$RUNNER_TEMP/services.log"
          grep -E -- '--- PASS: TestFindOrCreateUserCreatesOnceOnEveryDialect/postgres' "$RUNNER_TEMP/services.log"
