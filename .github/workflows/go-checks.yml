name: go checks

# Builds and tests the Go modules. Nothing ran `go test` on CI before this,
# so the db-proxy - the only service that talks to a data store - and the
# workflow engine were verified only on whoever's machine last touched them.
#
# One job per module because each is its own `go.mod` reached by `replace`
# directives, so building one does not build, let alone test, the others.
# Modules with no tests are still built: a compile break in a generated
# client or a service entry point is worth catching, and `go build` is cheap.

on:
  push:
    branches: [main, master, release]
    paths:
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      # The contract generator's golden test compares the committed outputs
      # with fresh ones, so a change to a contract or to a generated file alone
      # must run it. The generated TypeScript and Rust paths must match the
      # outputs in CONTRACTS in scripts/gen-contracts.sh; generated Go matches
      # "**.go".
      - "shared/common/contracts/**"
      - "shared/clients/typescript/api/platform-gateway.gen.ts"
      - "shared/common/typescript/cloudevents/Companion/module-request.gen.ts"
      - "barkloader/lib_sandbox/src/contracts/companion_gateway.gen.rs"
      - ".github/workflows/go-checks.yml"
  pull_request:
    paths:
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      - "shared/common/contracts/**"
      - "shared/clients/typescript/api/platform-gateway.gen.ts"
      - "shared/common/typescript/cloudevents/Companion/module-request.gen.ts"
      - "barkloader/lib_sandbox/src/contracts/companion_gateway.gen.rs"
      - ".github/workflows/go-checks.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module:
          - db
          - workflow
          - services/nats
          - build/orchestrator
          - shared/clients/golang/barkloader
          - shared/clients/golang/db
          - shared/clients/golang/nats
          - shared/clients/golang/servicediscovery
          - shared/common/golang/cloudevents
          - shared/common/golang/conditions
          - shared/common/golang/config
          - shared/common/golang/logging
          - shared/common/golang/platformgateway
          - shared/common/golang/runtime
          - shared/common/contracts/gen
    steps:
      - uses: actions/checkout@v4

      # The version mise.toml pins, so CI runs what developers run. Reading
      # each module's own `go` directive instead would test most of them on
      # 1.23, which nobody uses and which several already exceed.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # -race catches the data races the services' goroutine-heavy code is
      # prone to; it needs cgo, which ubuntu-latest has.
      - name: Test
        if: matrix.module != 'db'
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

      # db/app/services migrates a fresh database for every case, and under
      # the race detector it has not finished in 25 minutes (about 90 seconds
      # without), so that one package runs without -race until its fixtures
      # share a migrated database. Every other db package keeps -race.
      - name: Test with the race detector
        if: matrix.module == 'db'
        working-directory: db
        run: |
          set -o pipefail
          pkgs=$(go list ./... | grep -v '/app/services$')
          test -n "$pkgs"
          go test -race $pkgs

      - name: Test db/app/services
        if: matrix.module == 'db'
        working-directory: db
        run: go test ./app/services/

  # Informational for now: it reports vulnerabilities in dependencies and in
  # the standard library of the pinned Go version, which a PR cannot always
  # fix, and the baseline is not clean yet. The scan step tolerates findings
  # (the job still shows green) and writes them to the job summary; flip
  # continue-on-error off once the baseline is clean. Every module is scanned
  # (keep this list equal to the check job's) because a library module is
  # judged on its own call graph, not its consumers'.
  #
  # govulncheck is installed at a pinned version rather than through
  # golang/govulncheck-action, which installs @latest and so breaks whenever
  # the tool moves to a Go release newer than the one pinned above.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module:
          - db
          - workflow
          - services/nats
          - build/orchestrator
          - shared/clients/golang/barkloader
          - shared/clients/golang/db
          - shared/clients/golang/nats
          - shared/clients/golang/servicediscovery
          - shared/common/golang/cloudevents
          - shared/common/golang/conditions
          - shared/common/golang/config
          - shared/common/golang/logging
          - shared/common/golang/platformgateway
          - shared/common/golang/runtime
          - shared/common/contracts/gen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Scan ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '### govulncheck ${{ matrix.module }}'
            echo '```'
            govulncheck ./... | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The postgres migration tests skip without a database to run against, so
  # the check job above only proves them against sqlite. This one gives them a
  # throwaway postgres: the dialect-specific SQL (jsonb casts and scans,
  # INSERT ... SELECT copies) is only exercised here.
  postgres-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: woofx3
          POSTGRES_PASSWORD: migration-test
          POSTGRES_DB: woofx3_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U woofx3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: db/go.sum

      # One package at a time: every test in it clears the shared database
      # when it ends and refuses to start on one that is not empty.
      - name: Test postgres migrations
        working-directory: db
        env:
          WOOFX3_MIGRATION_TEST_POSTGRES_URL: postgres://woofx3:migration-test@127.0.0.1:5432/woofx3_migration_test?sslmode=disable
        run: go test -p 1 -count=1 ./database/migrate/migrations/postgres/...

      # The db services' Postgres cases (alert counts, aggregates, scene editor
      # state) skip without the database URL, so they run here too. The first
      # grep fails the step if any case skipped for want of the URL; a case
      # that skips one dialect on purpose says why and is not caught.
      - name: Test db services against postgres
        working-directory: db
        shell: bash
        env:
          WOOFX3_MIGRATION_TEST_POSTGRES_URL: postgres://woofx3:migration-test@127.0.0.1:5432/woofx3_migration_test?sslmode=disable
        run: |
          go test -p 1 -count=1 -v ./app/services/... | tee "$RUNNER_TEMP/services.log"
          if grep -F -- 'WOOFX3_MIGRATION_TEST_POSTGRES_URL not set' "$RUNNER_TEMP/services.log"; then
            echo "a Postgres case skipped without the database URL"
            exit 1
          fi
          grep -E -- '--- PASS: TestCountAlertsByHourCountsEachHourByOutcome/postgres' "$RUNNER_TEMP/services.log"
