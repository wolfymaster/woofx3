name: Release

# Every push to master that semantic-release finds a release in (a feat, fix,
# perf or breaking commit since the last v* tag) publishes:
#   - the image, ghcr.io/wolfymaster/woofx3:<tag> (+ :latest)
#   - woofx3-<tag>-linux-amd64.zip, extracted from the image
#   - woofx3-<tag>-windows-amd64.zip, cross-compiled by build/main.sh
#   - a GitHub release of the tag, carrying both archives and the image digest
#
# The version is settled before anything is built, since the image reports it
# (WOOFX3_VERSION), and nothing is tagged until every artifact exists: the
# image is pushed by digest alone, and the git tag, the release and the
# image's tags are all created in the last job.

on:
  push:
    branches:
      - master

# Releases are cut one at a time, in push order. A run that is still building
# when the next push lands finishes; the next run then finds its tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/wolfymaster/woofx3
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24"
  # The preset stays on 9.x: 10.x needs conventional-changelog-writer 9, and
  # @semantic-release/release-notes-generator 14 still bundles writer 8.
  SEMANTIC_RELEASE: >-
    -p semantic-release@25.0.9
    -p @semantic-release/exec@7.1.0
    -p @semantic-release/github@12.0.9
    -p conventional-changelog-conventionalcommits@9.3.1
    semantic-release

jobs:
  plan:
    name: Settle the next version
    runs-on: ubuntu-latest
    # A dry run still checks it could push the tag.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Sets `tag` through .github/scripts/release-tag.sh; left empty when
      # nothing since the last release calls for one.
      - name: Dry-run semantic-release
        id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes ${SEMANTIC_RELEASE} --dry-run

  docker:
    name: Image + Linux archive
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            WOOFX3_VERSION=${{ needs.plan.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Linux archive from image
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          CID="$(docker create "${IMAGE_NAME}@${DIGEST}")"
          mkdir -p linux-amd64
          docker cp "${CID}:/app/." linux-amd64/
          docker rm "$CID"
          test -x linux-amd64/orchestrator
          ARCHIVE="woofx3-${TAG}-linux-amd64.zip"
          zip -r --symlinks "$ARCHIVE" linux-amd64
          ls -lh "$ARCHIVE"

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: woofx3-${{ needs.plan.outputs.tag }}-linux-amd64.zip
          if-no-files-found: error

  windows:
    name: Windows archive
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            jq \
            zip \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            mingw-w64 \
            gcc-mingw-w64-x86-64

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build Windows package
        env:
          PROTOC_INCLUDE: /usr/include
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          set -euo pipefail
          cd build
          chmod +x main.sh scripts/*.sh
          ./main.sh --clean --target windows-amd64
          test -f dist/windows-amd64/orchestrator.exe
          test -f dist/services-windows-amd64.zip

      - name: Name the archive for the release
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cp build/dist/services-windows-amd64.zip "woofx3-${TAG}-windows-amd64.zip"
          ls -lh "woofx3-${TAG}-windows-amd64.zip"

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: woofx3-${{ needs.plan.outputs.tag }}-windows-amd64.zip
          if-no-files-found: error

  release:
    name: Tag and publish
    needs: [plan, docker, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      DIGEST: ${{ needs.docker.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # .releaserc.json attaches dist/*.zip to the release.
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Tag and create the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_EXPECTED_TAG: ${{ needs.plan.outputs.tag }}
        run: npx --yes ${SEMANTIC_RELEASE}

      # semantic-release exits cleanly without releasing when master moved on
      # since the dry run, or when a rerun finds the tag already published.
      # Only the second may go on to tag the image.
      - name: Check the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse "${TAG}^{commit}")" = "$(git rev-parse HEAD)"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > published
          printf '%s\n' "woofx3-${TAG}-linux-amd64.zip" "woofx3-${TAG}-windows-amd64.zip" | sort > expected
          diff expected published

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${DIGEST}"

      - name: Add the image to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > notes.md
          if grep -qF '## Container image' notes.md; then
            exit 0
          fi
          cat >> notes.md <<EOF

          ## Container image

          \`\`\`
          docker pull ${IMAGE_NAME}:${TAG}
          \`\`\`

          Digest: \`${DIGEST}\`

          Deploy by digest, which never moves:

          \`\`\`
          ${IMAGE_NAME}@${DIGEST}
          \`\`\`

          Also tagged as \`${IMAGE_NAME}:latest\`, which moves with every release; never deploy it.

          ## Binary packages

          - \`woofx3-${TAG}-linux-amd64.zip\`: Linux binaries and the orchestrator (the image's \`/app\` layout)
          - \`woofx3-${TAG}-windows-amd64.zip\`: Windows executables and the orchestrator

          Extract and run \`./start.sh\` (Linux) or \`start.bat\` (Windows). Edit the packaged \`.woofx3.json\` template before production use.
          EOF
          gh release edit "$TAG" --notes-file notes.md
