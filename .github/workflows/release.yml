name: Release

# Every push to master that semantic-release finds a release in (a feat, fix,
# perf or breaking commit since the last v* tag) publishes:
#   - the image, ghcr.io/wolfymaster/woofx3:<tag> (+ :latest)
#   - woofx3-<tag>-linux-amd64.zip, extracted from the image
#   - woofx3-<tag>-windows-amd64.zip, cross-compiled by build/main.sh
#   - a GitHub release of the tag, carrying both archives and the image digest
#   - the release's entry in CHANGELOG.md, committed to master; the tag points
#     at that commit, whose parent is the commit the artifacts were built from
#
# The version is settled before anything is built, since the image reports it
# (WOOFX3_VERSION), and nothing is tagged until every artifact exists: the
# image is pushed by digest alone, and the git tag, the release and the
# image's tags are all created in the last job.

on:
  push:
    branches:
      - master

# Releases are cut one at a time, in push order. A run that is still building
# when the next push lands finishes; the next run then finds its tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/wolfymaster/woofx3
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24"
  # release-preview.yml installs the same semantic-release and preset.
  # The preset stays on 9.x: 10.x needs conventional-changelog-writer 9, and
  # @semantic-release/release-notes-generator 14 still bundles writer 8.
  SEMANTIC_RELEASE: >-
    -p semantic-release@25.0.9
    -p @semantic-release/changelog@7.0.0
    -p @semantic-release/exec@7.1.0
    -p @semantic-release/git@11.0.1
    -p @semantic-release/github@12.0.9
    -p conventional-changelog-conventionalcommits@9.3.1
    semantic-release

jobs:
  plan:
    name: Settle the next version
    runs-on: ubuntu-latest
    # The dry run pushes nothing, and checks it could push the tag with the
    # app token rather than GITHUB_TOKEN.
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      # Made here too, with the same app as the release job, so a missing app
      # or key fails before anything is built.
      - name: Create the release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Sets `tag` through .github/scripts/release-tag.sh; left empty when
      # nothing since the last release calls for one.
      - name: Dry-run semantic-release
        id: next
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx --yes ${SEMANTIC_RELEASE} --dry-run

  docker:
    name: Image + Linux archive
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            WOOFX3_VERSION=${{ needs.plan.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Linux archive from image
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          CID="$(docker create "${IMAGE_NAME}@${DIGEST}")"
          mkdir -p linux-amd64
          docker cp "${CID}:/app/." linux-amd64/
          docker rm "$CID"
          test -x linux-amd64/orchestrator
          ARCHIVE="woofx3-${TAG}-linux-amd64.zip"
          zip -r --symlinks "$ARCHIVE" linux-amd64
          ls -lh "$ARCHIVE"

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: woofx3-${{ needs.plan.outputs.tag }}-linux-amd64.zip
          if-no-files-found: error

  windows:
    name: Windows archive
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            jq \
            zip \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            mingw-w64 \
            gcc-mingw-w64-x86-64

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build Windows package
        env:
          PROTOC_INCLUDE: /usr/include
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          set -euo pipefail
          cd build
          chmod +x main.sh scripts/*.sh
          ./main.sh --clean --target windows-amd64
          test -f dist/windows-amd64/orchestrator.exe
          test -f dist/services-windows-amd64.zip

      - name: Name the archive for the release
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cp build/dist/services-windows-amd64.zip "woofx3-${TAG}-windows-amd64.zip"
          ls -lh "woofx3-${TAG}-windows-amd64.zip"

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: woofx3-${{ needs.plan.outputs.tag }}-windows-amd64.zip
          if-no-files-found: error

  release:
    name: Tag and publish
    needs: [plan, docker, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      DIGEST: ${{ needs.docker.outputs.digest }}
    steps:
      # The CHANGELOG.md commit goes straight to master, which the
      # WolfyMasterOnly ruleset closes to everything but pull requests. This
      # app is the ruleset's bypass actor; GITHUB_TOKEN cannot be one.
      - name: Create the release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # checkout persists its token as git's credentials, and they take
      # precedence over the one semantic-release puts in the push URL.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # .releaserc.json attaches dist/*.zip to the release.
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          # Only the archives: the image job's Docker build record is also a run artifact, and it is not a zip.
          pattern: "*-amd64"
          path: dist
          merge-multiple: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Tag and create the release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_EXPECTED_TAG: ${{ needs.plan.outputs.tag }}
        run: npx --yes ${SEMANTIC_RELEASE}

      # semantic-release exits cleanly without releasing when master moved on
      # since the dry run, or when a rerun finds the tag already published.
      # Only the second may go on to tag the image. The first is routine when
      # pull requests merge minutes apart: the run for the newer push, queued
      # behind this one, releases these commits along with its own, so this
      # run ends without tagging rather than failing. Its image stays in the
      # registry by digest alone. The tag is on the CHANGELOG.md commit, which
      # must sit directly on the commit the artifacts were built from and
      # change nothing else.
      - name: Check the release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if ! git rev-parse --quiet --verify "refs/tags/${TAG}" > /dev/null; then
            head="$(git rev-parse origin/master)"
            if [ "$head" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$head"; then
              echo "::notice::Not released: master moved on to ${head}, whose run releases these commits."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::semantic-release published no ${TAG}, and master has not moved on."
            exit 1
          fi
          released="$(git rev-parse "${TAG}^{commit}")"
          test "$(git rev-parse "${released}^")" = "${GITHUB_SHA}"
          test "$(git diff --name-only "${GITHUB_SHA}" "$released")" = "CHANGELOG.md"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > published
          printf '%s\n' "woofx3-${TAG}-linux-amd64.zip" "woofx3-${TAG}-windows-amd64.zip" | sort > expected
          diff expected published
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.check.outputs.released == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image
        if: steps.check.outputs.released == 'true'
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${DIGEST}"

      - name: Add the image to the release notes
        if: steps.check.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > notes.md
          if grep -qF '## Container image' notes.md; then
            exit 0
          fi
          cat >> notes.md <<EOF

          ## Container image

          \`\`\`
          docker pull ${IMAGE_NAME}:${TAG}
          \`\`\`

          Digest: \`${DIGEST}\`

          Deploy by digest, which never moves:

          \`\`\`
          ${IMAGE_NAME}@${DIGEST}
          \`\`\`

          Also tagged as \`${IMAGE_NAME}:latest\`, which moves with every release; never deploy it.

          ## Binary packages

          - \`woofx3-${TAG}-linux-amd64.zip\`: Linux binaries and the orchestrator (the image's \`/app\` layout)
          - \`woofx3-${TAG}-windows-amd64.zip\`: Windows executables and the orchestrator

          Extract and run \`./start.sh\` (Linux) or \`start.bat\` (Windows). Edit the packaged \`.woofx3.json\` template before production use.
          EOF
          gh release edit "$TAG" --notes-file notes.md

      # The changelog is the release's notes up to the sections the step above
      # appends, without semantic-release's version heading, which the embed's
      # title carries. An embed description holds at most 4096 characters, so
      # a longer changelog is cut at a line and links to the release for the rest.
      - name: Announce the release on Discord
        if: steps.check.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then
            echo "::error::The DISCORD_RELEASE_WEBHOOK_URL secret is not set."
            exit 1
          fi
          gh release view "$TAG" --json body,url > release.json
          jq '
            .url as $url
            | (.body
               | split("\n## Container image")[0]
               | sub("^## \\[[^\n]*\n+"; "")
               | sub("\\s+$"; "")) as $changelog
            | {
                username: "woofx3",
                embeds: [{
                  title: "woofx3 \(env.TAG) released",
                  url: $url,
                  color: 5793266,
                  description: (
                    if ($changelog | length) > 3900 then
                      ($changelog[:3900] | sub("\n[^\n]*$"; "")) + "\n\n[Full changelog](\($url))"
                    else
                      $changelog
                    end
                  )
                }]
              }
          ' release.json > discord.json
          curl --fail-with-body --silent --show-error \
            --header "Content-Type: application/json" \
            --data @discord.json \
            "$DISCORD_RELEASE_WEBHOOK_URL"
