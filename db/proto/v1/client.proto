syntax = "proto3";

package client;
option go_package = "github.com/wolfymaster/woofx3/db/gen/v1";

import "common.proto";
import "google/protobuf/timestamp.proto";

service ClientService {
    rpc CreateClient(CreateClientRequest) returns (ClientResponse);
    rpc GetClient(GetClientRequest) returns (ClientResponse);
    rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
    rpc UpdateClient(UpdateClientRequest) returns (ClientResponse);
    rpc DeleteClient(DeleteClientRequest) returns (common.ResponseStatus);
    rpc ValidateClient(ValidateClientRequest) returns (ClientResponse);
    rpc RecordClientAuthentication(RecordClientAuthenticationRequest) returns (common.ResponseStatus);
    // Sets or clears where the engine ships a client's events, leaving every
    // other field alone (UpdateClient overwrites them all).
    rpc SetClientEventsTarget(SetClientEventsTargetRequest) returns (ClientResponse);
}

// How a client came to exist.
enum ClientKind {
    CLIENT_KIND_UNSPECIFIED = 0;
    // Called registerClient: a desktop shell, a cloud dashboard, a CLI.
    CLIENT_KIND_REGISTERED = 1;
    // Obtained by a browser through pairing; bound to its origin.
    CLIENT_KIND_PAIRED = 2;
}

message Client {
    string id = 1;
    string description = 2;
    reserved 3;
    reserved "application_id";
    string client_id = 4;
    // Set only in CreateClient's response. db-proxy keeps only a hash, so no
    // other response can carry it.
    string client_secret = 5;
    string callback_url = 6;
    string callback_token = 7;
    ClientKind kind = 8;
    // The web origin a paired client is bound to; empty for a registered one.
    string origin = 9;
    google.protobuf.Timestamp created_at = 10;
    // Unset until an authentication is recorded.
    google.protobuf.Timestamp last_authenticated_at = 11;
    // Where events go instead of callback_url; both empty when unset.
    string events_url = 12;
    string events_token = 13;
}

message CreateClientRequest {
    string description = 1;
    reserved 2;
    reserved "application_id";
    string callback_url = 3;
    string callback_token = 4;
    // Required. A paired client needs an origin; a registered one must not have one.
    ClientKind kind = 5;
    string origin = 6;
    // Both set or both empty.
    string events_url = 7;
    string events_token = 8;
}

message GetClientRequest {
    string client_id = 1;
}

message ListClientsRequest {
    reserved 1;
    reserved "application_id";
}

message UpdateClientRequest {
    string id = 1;
    string description = 2;
    string callback_url = 3;
    string callback_token = 4;
}

// Both fields set to set the target, both empty to clear it.
message SetClientEventsTargetRequest {
    string id = 1;
    string events_url = 2;
    string events_token = 3;
}

message DeleteClientRequest {
    string id = 1;
}

message ValidateClientRequest {
    string client_id = 1;
    string client_secret = 2;
}

message RecordClientAuthenticationRequest {
    string client_id = 1;
}

message ClientResponse {
    common.ResponseStatus status = 1;
    Client client = 2;
}

message ListClientsResponse {
    common.ResponseStatus status = 1;
    repeated Client clients = 2;
}
