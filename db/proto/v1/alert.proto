syntax = "proto3";

package alert;
option go_package = "github.com/wolfymaster/woofx3/db/gen/v1";

import "common.proto";
import "google/protobuf/timestamp.proto";

// Append-only log of dispatched alert envelopes. Mirrors the
// `Workflow` / `Scene` shape: typed audit columns + opaque JSON
// `payload` the engine never inspects.
//
// Replay path: the api gateway calls `GetAlert` to fetch the row,
// re-publishes `payload` to the `ui.notify.alert` NATS subject (so
// sceneManager delivers it to overlays exactly like the original
// dispatch), then calls `UpdateAlertStatus(..., "replayed")`.
//
// Lifecycle path: the scene manager reports each play's `playing` /
// `completed` / `failed` / `skipped` against the row CreateAlert returned for
// it, via `UpdateAlertLifecycle`, which atomically advances `status` and
// stamps the matching timestamp (played_at / completed_at) and optional
// error.
service AlertService {
  rpc CreateAlert(CreateAlertRequest) returns (AlertResponse);
  rpc GetAlert(GetAlertRequest) returns (AlertResponse);
  rpc GetAlertByEnvelopeId(GetAlertByEnvelopeIdRequest) returns (AlertResponse);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
  rpc CountAlertsByHour(CountAlertsByHourRequest) returns (CountAlertsByHourResponse);
  rpc UpdateAlertStatus(UpdateAlertStatusRequest) returns (AlertResponse);
  rpc UpdateAlertLifecycle(UpdateAlertLifecycleRequest) returns (AlertResponse);
  rpc DeleteAlert(DeleteAlertRequest) returns (common.ResponseStatus);
}

message Alert {
  string id = 1;
  reserved 2;
  reserved "application_id";
  // Full AlertPayload envelope JSON
  // (`{ id, parameters, event }`) — same bytes delivered to overlays.
  // Persisted verbatim in `alerts.payload` (JSONB).
  string payload = 3;
  // Optional attribution. `workflow_id` is the workflow execution
  // (if any) that fired the alert; `source_event_id` is the
  // originating CloudEvent id (when available). Empty / blank for
  // manual / debug dispatches.
  string workflow_id = 4;
  string source_event_id = 5;
  // Lifecycle:
  //   `sent`       — engine published; overlay has not yet ack'd
  //   `playing`    — overlay reported the widget mounted
  //   `completed`  — overlay reported the widget finished playing
  //   `failed`     — overlay reported a render / playback error
  //   `replayed`   — operator re-fired this row from the UI
  // Phase 2 will add `pending`, `dispatched`, `timed_out`, `skipped`.
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Denormalised AlertPayload envelope id (`payload->>'id'`). The
  // overlay's status reports key on this value, not the row id.
  string envelope_id = 9;
  // Set when the engine published the envelope to NATS. Phase 2
  // (backend queue) will treat the absence of this stamp as
  // "still pending"; Phase 1 stamps it on insert.
  google.protobuf.Timestamp dispatched_at = 10;
  // Set when the overlay reported `playing`.
  google.protobuf.Timestamp played_at = 11;
  // Set when the overlay reported `completed` or `failed`.
  google.protobuf.Timestamp completed_at = 12;
  // Failure reason captured from a `failed` ack. Empty when
  // status is not `failed`.
  string error = 13;
  // Incremented by every write that publishes the row. Receivers order
  // snapshots of one row by it: two writes never share a version.
  int64 version = 14;
}

message CreateAlertRequest {
  reserved 1;
  reserved "application_id";
  // JSON-encoded AlertPayload. Persisted verbatim into `alerts.payload`.
  string payload = 2;
  // Optional attribution (see Alert.workflow_id / source_event_id).
  string workflow_id = 3;
  string source_event_id = 4;
  // AlertPayload envelope id (`payload.id`). Persisted to the
  // denormalised `envelope_id` column for fast lookup on the overlay
  // ack path. Optional for backwards compatibility — older callers that
  // don't supply this still create rows, just without the index hit.
  string envelope_id = 5;
}

message GetAlertRequest {
  string id = 1;
}

// Lookup by the AlertPayload envelope id (`payload->>'id'`). Returns
// `NOT_FOUND` if no row carries that envelope id. Used by the api when
// the overlay reports `playing` / `completed` / `failed`.
message GetAlertByEnvelopeIdRequest {
  reserved 1;
  reserved "application_id";
  string envelope_id = 2;
}

// Atomic, forward-only transition of one alert row's lifecycle. The status
// string is the target state; the db service decides which timestamp column
// to stamp (see AlertRepository.transitionUpdateSQL). `error` is ignored
// unless status is `failed` or `timed_out`.
//
// `id` names the row the report concerns: the row CreateAlert returned for
// the play being reported. One envelope can have several rows (a workflow
// that pins `parameters.id` plays the same envelope id more than once), so
// only the row id says which play a report belongs to. The row must carry
// `envelope_id`. A report without `id` moves the envelope's newest row, the
// best guess for a delivery that never learned its row id.
message UpdateAlertLifecycleRequest {
  reserved 1;
  reserved "application_id";
  string envelope_id = 2;
  string status = 3;
  string error = 4;
  string id = 5;
}

message AlertResponse {
  common.ResponseStatus status = 1;
  Alert alert = 2;
}

message ListAlertsRequest {
  reserved 1;
  reserved "application_id";
  int32 limit = 2;
  int32 offset = 3;
  // When set, only the alerts that workflow execution fired (`Alert.workflow_id`).
  // `total_count` then counts those alerts only. Not a UUID: INVALID_ARGUMENT.
  string workflow_id = 6;
}

message ListAlertsResponse {
  common.ResponseStatus status = 1;
  repeated Alert alerts = 2;
  int64 total_count = 3;
  int32 limit = 4;
  int32 offset = 5;
}

// Counts the alerts created in `hours` whole hours from `since`, by hour and
// outcome. `since` is on the hour, and `hours` is 1 to 168 (must match
// MaxAlertCountHours in database/repository/alert_repository.go); anything
// else is INVALID_ARGUMENT.
//
// An alert still on its way is UNCONFIRMED, rather than IN_FLIGHT, when it
// was last written before `unconfirmed_before`: nothing has reported on it
// for long enough that no report is coming. The caller chooses the bound,
// since it owns the clock.
message CountAlertsByHourRequest {
  google.protobuf.Timestamp since = 1;
  int32 hours = 2;
  google.protobuf.Timestamp unconfirmed_before = 3;
}

// What an alert counts as. db-proxy owns the rule from status to outcome:
// `timed_out` is FAILED, and `replayed` (an operator replayed it as a row of
// its own) is neither a success nor a failure.
enum AlertOutcome {
  ALERT_OUTCOME_UNSPECIFIED = 0;
  ALERT_OUTCOME_COMPLETED = 1;
  ALERT_OUTCOME_FAILED = 2;
  ALERT_OUTCOME_SKIPPED = 3;
  ALERT_OUTCOME_REPLAYED = 4;
  ALERT_OUTCOME_IN_FLIGHT = 5;
  ALERT_OUTCOME_UNCONFIRMED = 6;
}

// How many alerts created in hour `hour` of the window (0 is the hour that
// starts at `since`) count as `outcome`. Only pairs with a count above zero
// are listed.
message AlertHourCount {
  int32 hour = 1;
  AlertOutcome outcome = 2;
  int64 count = 3;
}

// `truncated` is true when the window starts before the alert retention
// horizon (EVENT_DETAIL_RETENTION_PERIOD): settled alerts older than it have
// been pruned, so the earliest hours count only those still on their way.
message CountAlertsByHourResponse {
  common.ResponseStatus status = 1;
  repeated AlertHourCount counts = 2;
  bool truncated = 3;
}

message UpdateAlertStatusRequest {
  string id = 1;
  string status = 2;
}

message DeleteAlertRequest {
  string id = 1;
}
