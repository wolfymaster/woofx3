syntax = "proto3";

package scene;
option go_package = "github.com/wolfymaster/woofx3/db/gen/v1";

import "common.proto";
import "google/protobuf/timestamp.proto";

// A widget arrangement.
//
// Mirrors `workflow.Workflow` in shape: typed audit fields + opaque
// JSON strings (`widgets_json`, `layout_json`) the engine forwards
// verbatim. The streamware overlay (and any future Convex scene
// editor) interprets the JSON; the engine only stores and delivers it.
//
// Why JSON-as-string and not a typed sub-message?
//   - Widget instances reference module widgets by canonical id; the
//     engine doesn't know which fields a given widget's `settings`
//     accepts. A typed schema would either be too narrow (forcing
//     editor changes when a widget grows a new setting) or
//     uselessly broad (`map<string, Value>`).
//   - Mirrors `Workflow.steps_json` / `Workflow.trigger_json` — same
//     trade-off resolved the same way.
service SceneService {
    rpc CreateScene(CreateSceneRequest) returns (SceneResponse);
    rpc GetScene(GetSceneRequest) returns (SceneResponse);
    rpc UpdateScene(UpdateSceneRequest) returns (SceneResponse);
    rpc DeleteScene(DeleteSceneRequest) returns (common.ResponseStatus);
    rpc ListScenes(ListScenesRequest) returns (ListScenesResponse);
}

message Scene {
    string id = 1;
    reserved 2;
    reserved "application_id";
    string name = 3;
    string description = 4;
    // JSON array of placed widget instances. Shape:
    // `[{ id, widgetCanonicalId, position, settings }, ...]`.
    // Persisted verbatim in `scenes.widgets_json` (JSONB).
    string widgets_json = 5;
    // JSON object describing canvas-level layout (dimensions, grid,
    // theme). Optional; most scenes will store `{}`. Persisted
    // verbatim in `scenes.layout_json` (JSONB).
    string layout_json = 6;
    // Origin metadata. `created_by_type` is "USER" for UI-authored
    // scenes and "MODULE" if a future manifest surface ships preset
    // scenes. `created_by_ref` is the composite moduleKey for MODULE
    // rows, empty for USER rows.
    string created_by_type = 7;
    string created_by_ref = 8;
    google.protobuf.Timestamp created_at = 9;
    google.protobuf.Timestamp updated_at = 10;
    // The editor's unpublished widgets and layout, the same shapes as
    // `widgets_json` and `layout_json`. Set only when `has_draft`.
    string draft_widgets_json = 11;
    string draft_layout_json = 12;
    bool has_draft = 13;
    // The scene editor's sync state as a JSON object, owned by the scene
    // editor and opaque here. Empty when no editor has synced the scene.
    string editor_state_json = 14;
    // "scene" or "alert", fixed at creation. A scene is shown by overlays;
    // an alert is a library entry an alert step's layout is copied from,
    // never an overlay page.
    string kind = 15;
    // The published document's behaviors, a JSON object keyed by behavior
    // id; `{}` when it has none.
    string behaviors_json = 16;
    // The draft's behaviors, the same shape. Set only when `has_draft`.
    string draft_behaviors_json = 17;
    // The inputs the composition takes, a JSON array of ConfigFields; `[]`
    // when it takes none. Not drafted: both documents declare these.
    string inputs_json = 18;
}

message CreateSceneRequest {
    reserved 1;
    reserved "application_id";
    string name = 2;
    string description = 3;
    // JSON-encoded widget-instances array. Persisted verbatim into
    // `scenes.widgets_json`.
    string widgets_json = 4;
    // JSON-encoded layout object. Persisted verbatim into
    // `scenes.layout_json`.
    string layout_json = 5;
    string created_by_type = 6;
    string created_by_ref = 7;
    // "scene" or "alert"; empty creates a scene. Anything else is refused.
    string kind = 8;
    // JSON object of behaviors keyed by id; empty stores `{}`.
    string behaviors_json = 9;
    // JSON array of input fields; empty stores `[]`.
    string inputs_json = 10;
}

message GetSceneRequest {
    string id = 1;
}

message SceneResponse {
    common.ResponseStatus status = 1;
    Scene scene = 2;
}

// Patch semantics — every scalar field is "leave unchanged unless
// caller set it." Mirrors `UpdateWorkflowRequest`. Empty string is
// the sentinel for "not provided" today; revisit when migrating to
// `optional` scalars.
message UpdateSceneRequest {
    string id = 1;
    string name = 2;
    string description = 3;
    string widgets_json = 4;
    string layout_json = 5;
    // Store a draft, the same shapes as `widgets_json` and `layout_json`.
    // Both are set together; empty leaves the draft unchanged. The draft's
    // behaviors (`draft_behaviors_json`) are stored with them, `{}` when
    // that is empty, so a stored draft never pairs with behaviors from an
    // older one.
    string draft_widgets_json = 6;
    string draft_layout_json = 7;
    // Drop the draft (it was published or discarded), behaviors included.
    // Wins over a draft set in the same request.
    bool clear_draft = 8;
    // Store the scene editor's sync state, a JSON object. Written in the
    // same row update as the documents and draft in this request, so the
    // state never describes documents other than the stored ones. Empty
    // leaves it unchanged, unless the request writes a document (widgets,
    // layout, draft or clear_draft): the stored state is then cleared,
    // since it described the documents being replaced. Anything that is
    // not a JSON object is refused and nothing in the request is written.
    string editor_state_json = 9;
    // Drop the stored editor state in the same row update. Refused
    // together with `editor_state_json`.
    bool clear_editor_state = 10;
    // The published behaviors, a JSON object; empty leaves them unchanged.
    // A document like `widgets_json`: refused when not a JSON object.
    string behaviors_json = 11;
    // The draft's behaviors, a JSON object, written only with a draft
    // (`draft_widgets_json` and `draft_layout_json`). Refused when not a
    // JSON object, or set without the draft.
    string draft_behaviors_json = 12;
    // The inputs, a JSON array of input fields; empty leaves them
    // unchanged. A document like `widgets_json`: refused when not a JSON
    // array.
    string inputs_json = 13;
}

message DeleteSceneRequest {
    string id = 1;
}

message ListScenesRequest {
    reserved 1;
    reserved "application_id";
    int32 page = 2;
    int32 page_size = 3;
    string sort_by = 4;  // e.g. "name", "created_at", "updated_at"
    bool sort_desc = 5;
    // Which kind to list, "scene" or "alert". Empty lists scenes, so a
    // caller that predates alerts never sees one.
    string kind = 6;
}

message ListScenesResponse {
    common.ResponseStatus status = 1;
    repeated Scene scenes = 2;
    int32 total_count = 3;
    int32 page = 4;
    int32 page_size = 5;
}
