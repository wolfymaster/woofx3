syntax = "proto3";

package module_setting;

option go_package = "github.com/wolfymaster/woofx3/db/gen/v1";

message ModuleSettingRecord {
  string id         = 1;
  string module_id  = 2;
  string key        = 3;
  // Always empty for a `secret` setting: its value never leaves db-proxy in
  // this record. See GetModuleSecretValues.
  string value      = 4;
  string value_type = 5;
  // Whether a value is stored — the only way to tell for a secret.
  bool   is_set     = 6;
}

message ListModuleSettingsRequest {
  string module_id = 1;
}

message ListModuleSettingsResponse {
  repeated ModuleSettingRecord settings = 1;
}

message SetModuleSettingRequest {
  string module_id  = 1;
  string key        = 2;
  string value      = 3;
  string value_type = 4;
}

// Writes `value` only while the setting still holds `expected_value`, in one
// statement: the safe way for a module's functions to change a setting that
// other runs, or the streamer, may be changing at the same moment. Refused for
// a `secret` setting, whose stored value is sealed and never compared.
message CompareAndSetModuleSettingRequest {
  string module_id      = 1;
  string key            = 2;
  string expected_value = 3;
  string value          = 4;
}

message CompareAndSetModuleSettingResponse {
  bool swapped = 1;
  // The setting as stored after the call: the written row when swapped, else
  // what it holds now, which is what the caller retries from. Absent when no
  // such setting exists.
  ModuleSettingRecord current = 2;
}

message ManifestSettingInput {
  string key        = 1;
  string value      = 2;
  string value_type = 3;
}

message RegisterModuleSettingsRequest {
  string module_id                       = 1;
  repeated ManifestSettingInput settings = 2;
}

message RegisterModuleSettingsResponse {
  int32 registered = 1;
}

message GetModuleSecretValuesRequest {
  string module_id = 1;
}

// Decrypted `secret` settings by key. Only barkloader calls this, to build
// `ctx.module.settings` for the owning module's functions.
message GetModuleSecretValuesResponse {
  map<string, string> values = 1;
}

service ModuleSettingService {
  rpc ListModuleSettings(ListModuleSettingsRequest)       returns (ListModuleSettingsResponse);
  rpc SetModuleSetting(SetModuleSettingRequest)           returns (ModuleSettingRecord);
  rpc CompareAndSetModuleSetting(CompareAndSetModuleSettingRequest) returns (CompareAndSetModuleSettingResponse);
  rpc RegisterModuleSettings(RegisterModuleSettingsRequest) returns (RegisterModuleSettingsResponse);
  rpc GetModuleSecretValues(GetModuleSecretValuesRequest) returns (GetModuleSecretValuesResponse);
}
