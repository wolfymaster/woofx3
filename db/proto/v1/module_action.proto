syntax = "proto3";

package module;

option go_package = "github.com/wolfymaster/woofx3/db/gen/v1";

import "common.proto";

message Action {
  string id = 1;
  string name = 4;
  string description = 5;
  string call = 6;
  string params_schema = 7;
  string created_by_type = 8;
  string created_by_ref = 9;
  // Stable manifest-local identifier for this action declaration
  // (e.g. "play_alert"). Combined with the moduleId segment of
  // `created_by_ref` and the literal "action" kind, this forms the
  // canonical id `{moduleId}:action:{manifest_id}` used by every
  // reference and ledger row.
  string manifest_id = 10;
  // Engine action handler this action dispatches to (e.g. "function",
  // "alert"). For built-in non-function actions the handler is the
  // entire dispatch (`call` is empty); for function-type actions
  // `call` holds the canonical function id.
  string type = 11;
  // Open, multi-valued UI classification — dotted hierarchical strings
  // (e.g. "platform.govee", "function.lighting"). See
  // module.Trigger.taxonomy.
  repeated string taxonomy = 12;
  // JSON-encoded array of ConfigField-shaped output declarations
  // describing the action function's return value (e.g. the counter
  // module's increment action returns `{next, previous, step}`).
  // UI-only — the engine treats function results as opaque
  // map[string]any at runtime; this powers the workflow builder's
  // ${stepId.field} variable autocomplete. Empty/absent means the
  // action has no declared outputs.
  string output_schema = 13;
}

message ActionInput {
  string name = 1;
  string description = 2;
  string call = 3;
  string params_schema = 4;  // JSON string
  string manifest_id = 5;
  string type = 6;
  repeated string taxonomy = 7;
  string output_schema = 8;  // JSON string — see Action.output_schema
}

message RegisterActionsRequest {
  string module_key = 1;   // composite "{id}:{version}:{hash}" — stored as created_by_ref when created_by_type/ref are empty
  string module_name = 2;  // manifest.name — carried to event for display
  string version = 3;      // manifest.version — carried to event as metadata
  repeated ActionInput actions = 4;
  // Optional explicit registration identity. When both are set they override
  // the default (MODULE, module_key) pairing, letting non-module registrars
  // (e.g. SYSTEM services) upsert into the same table under their own
  // namespace. The upsert key is (created_by_type, created_by_ref, name).
  string created_by_type = 5;
  string created_by_ref = 6;
  // Scopes the registration to a specific application so cross-module
  // dependency checks are tenant-isolated.
  string application_id = 7;
}

message ListActionsRequest {
  string created_by_type = 1;
  string created_by_ref = 2;
}

message ListActionsResponse {
  common.ResponseStatus status = 1;
  repeated Action actions = 2;
}

