syntax = "proto3";

package storage;

option go_package = "github.com/wolfymaster/woofx3/db/gen/v1";

// Storage service for managing key-value storage with TTL and namespacing
service StorageService {
  // Get a value by key
  rpc Get(GetRequest) returns (GetResponse) {}
  
  // Set a key-value pair
  rpc Set(SetRequest) returns (SetResponse) {}

  // Write a value only if the key currently holds the expected one, in one
  // transaction. The only safe way to update a value from its previous one --
  // a counter, a queue -- when two callers may do it at once; a Get followed by
  // a Set loses one of the two writes.
  rpc CompareAndSet(CompareAndSetRequest) returns (CompareAndSetResponse) {}
  
  // Delete a key
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}
  
  // Clear all keys in a namespace
  rpc ClearNamespace(ClearNamespaceRequest) returns (ClearNamespaceResponse) {}
  
  // Clear all expired keys
  rpc ClearExpired(ClearExpiredRequest) returns (ClearExpiredResponse) {}
  
  // Clear all keys for an application
  rpc ClearAllForApplication(ClearAllForApplicationRequest) returns (ClearAllForApplicationResponse) {}

  // Clear every key flagged `clear_on_session_end`. The engine calls this when
  // a stream session ends; a module declares the key is session-scoped and the
  // engine acts on it, since the sandbox exposes no way to clear storage.
  rpc ClearSessionScoped(ClearSessionScopedRequest) returns (ClearSessionScopedResponse) {}
}

// Storage item with metadata.
//
// A value is addressed by (application_id, namespace, key). The namespace is
// the owning module's manifest id, so two modules using the same key never see
// each other's values; it is required on every read and write.
message StorageItem {
  string key = 1;
  string value = 2;
  int64 created_at = 3;  // Unix timestamp in seconds
  int64 expires_at = 4;  // 0 means never expires
  string namespace = 5;
  string application_id = 6;
  // Drop this key when the stream *session* ends. Not the same as the stream
  // going offline: a session spans dropouts, so clearing when the broadcast
  // stops would wipe exactly the state a brief reconnect is meant to preserve.
  // See docs/services/stream-sessions.md.
  bool clear_on_session_end = 7;
}

// Get a value by key
message GetRequest {
  string key = 1;
  string application_id = 2;
  string namespace = 3;
}

message GetResponse {
  StorageItem item = 1;
}

// Set a key-value pair
message SetRequest {
  StorageItem item = 1;
}

message SetResponse {}

// Write `item` only if the key holds `expected_value` now -- or holds nothing,
// when `expect_absent` is set.
message CompareAndSetRequest {
  StorageItem item = 1;
  string expected_value = 2;
  bool expect_absent = 3;
}

message CompareAndSetResponse {
  // Whether the write happened.
  bool swapped = 1;
  // What the key holds now: the value just written, or the one that stopped
  // the write, which is what a caller retries from. Absent when the key holds
  // nothing.
  StorageItem current = 2;
}

// Delete a key
message DeleteRequest {
  string key = 1;
  string application_id = 2;
  string namespace = 3;
}

message DeleteResponse {}

// Clear all keys in a namespace
message ClearNamespaceRequest {
  string namespace = 1;
  string application_id = 2;
}

message ClearNamespaceResponse {}

// Clear all expired keys
message ClearExpiredRequest {
  string application_id = 1;
}

message ClearExpiredResponse {}

// Clear all keys for an application
message ClearAllForApplicationRequest {
  string application_id = 1;
}

message ClearAllForApplicationResponse {}

// Clear every key flagged `clear_on_session_end`
message ClearSessionScopedRequest {
  string application_id = 1;
}

message ClearSessionScopedResponse {
  // How many keys were dropped. Clearing fires automatically at a session
  // boundary with nobody watching, so the count is the only evidence in a log
  // that it ran and what it did.
  int32 cleared = 1;
  // Which keys were dropped, by namespace and key, so the engine can announce
  // each one as changed: a screen showing a session value has to learn that it
  // went back to nothing.
  repeated StorageItem cleared_items = 2;
}
