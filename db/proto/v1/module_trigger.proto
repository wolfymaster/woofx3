syntax = "proto3";

package module;

option go_package = "github.com/wolfymaster/woofx3/db/gen/v1";

import "common.proto";

message Trigger {
  string id = 1;
  reserved 4;                        // was: string category, replaced by taxonomy
  reserved "category";
  string name = 5;
  string description = 6;
  string event = 7;
  string config_schema = 8;
  bool allow_variants = 9;
  string created_by_type = 10;
  string created_by_ref = 11;
  // Stable manifest-local identifier for this trigger declaration
  // (e.g. "channel_subscribe"). Combined with the moduleId segment of
  // `created_by_ref` and the literal "trigger" kind, this forms the
  // canonical id `{moduleId}:trigger:{manifest_id}` used by every
  // reference and ledger row.
  string manifest_id = 12;
  // Open, multi-valued UI classification — dotted hierarchical strings
  // (e.g. "platform.twitch.chat"). Multiple entries express independent
  // classification axes. Not validated against a fixed vocabulary.
  repeated string taxonomy = 13;
  // JSON-encoded DataShape naming what `trigger.data` carries when this
  // trigger fires: `{"fields":[{"path","type","description?","example?"}]}`.
  //
  // Deliberately not called a schema: nothing validates an event payload
  // against it. It answers "which paths can a workflow reference", which is
  // the only question the variable picker asks. config_schema is a different
  // thing entirely — the trigger's configuration *form* — and the two are not
  // the same shape, which is why this exists: only config fields carrying an
  // `eventPath` become variables today, so a trigger emitting keys it does not
  // also expose as config fields cannot advertise them at all.
  //
  // Empty/absent means the trigger declares nothing, and the UI falls back to
  // the config_schema derivation exactly as it does today.
  string emits = 14;
}

message TriggerInput {
  reserved 1;                        // was: string category, replaced by taxonomy
  reserved "category";
  string name = 2;
  string description = 3;
  string event = 4;
  string config_schema = 5;   // JSON string
  bool allow_variants = 6;
  string manifest_id = 7;
  repeated string taxonomy = 8;
  string emits = 9;  // JSON string — see Trigger.emits
}

message RegisterTriggersRequest {
  string module_key = 1;  // composite "{id}:{version}:{hash}" — carried to the outbox event so consumers can resolve the exact installed version
  string module_name = 2;  // manifest.name — carried to event for display
  string version = 3;      // manifest.version — carried to event as metadata
  repeated TriggerInput triggers = 4;
  // Optional explicit registration identity. When both are set they override
  // the default (MODULE, module_id) pairing, letting non-module registrars
  // (e.g. SYSTEM services) upsert into the same table under their own
  // namespace. The upsert key is (created_by_type, created_by_ref, name).
  string created_by_type = 5;
  string created_by_ref = 6;
  // Scopes the registration to a specific application so cross-module
  // dependency checks are tenant-isolated.
  string application_id = 7;
  // Stable manifest id (`manifest.id`, e.g. "twitch_platform"), version-free
  // so a module upgrade upserts its resources in place instead of orphaning
  // every reference. Stored as created_by_ref when created_by_type/ref are
  // empty, and emitted on the outbox event as `module_prefix`.
  string module_id = 8;
}

message ListTriggersRequest {
  string created_by_type = 1;
  string created_by_ref = 2;
}

message ListTriggersResponse {
  common.ResponseStatus status = 1;
  repeated Trigger triggers = 2;
}

